<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>لوحة تحكم الأدمن - الطفرة أونلاين</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
body { font-family: 'Almarai', sans-serif; background: #f0f4f8; }
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="min-h-screen">

<div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-900 to-blue-600">
    <div class="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <span class="material-symbols-outlined text-white text-3xl">school</span>
            </div>
            <h1 class="text-2xl font-black text-blue-900">لوحة التحكم</h1>
            <p class="text-gray-500 text-sm mt-1">الطفرة أونلاين - ميس ندى كامل</p>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">كلمة المرور</label>
                <input id="passwordInput" type="text" placeholder="اكتب 12341234 هنا" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-blue-500 outline-none text-right"/>
            </div>
            <button onclick="adminLogin()" class="w-full py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition">تسجيل الدخول</button>
            <p id="loginError" class="text-red-500 text-sm text-center hidden">كلمة المرور خاطئة!</p>
        </div>
    </div>
</div>

<div id="adminDashboard" class="hidden">
    <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center">
                <span class="material-symbols-outlined text-white">school</span>
            </div>
            <div>
                <h1 class="font-black text-blue-900">لوحة التحكم</h1>
                <p class="text-xs text-gray-500">ميس ندى كامل</p>
            </div>
        </div>
        <button onclick="adminLogout()" class="flex items-center gap-2 text-red-500 font-bold text-sm">خروج</button>
    </header>

    <div class="bg-white border-b px-6 flex gap-6 overflow-x-auto">
        <button onclick="showTab('lessons')" id="tab-lessons" class="py-4 font-bold text-blue-600 border-b-2 border-blue-600 whitespace-nowrap">إدارة الحصص</button>
        <button onclick="showTab('codes')" id="tab-codes" class="py-4 font-bold text-gray-400 whitespace-nowrap">توليد الأكواد</button>
        <button onclick="showTab('students')" id="tab-students" class="py-4 font-bold text-gray-400 whitespace-nowrap">الطلاب</button>
    </div>

    <main class="p-6 max-w-4xl mx-auto">
        <div id="tab-content-lessons">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-gray-800">الحصص الحالية</h2>
                <button onclick="showAddLesson()" class="flex items-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-xl font-bold text-sm">+ إضافة حصة</button>
            </div>
            <div id="addLessonForm" class="hidden bg-white rounded-2xl p-6 mb-6 shadow-sm border border-blue-100">
                <div class="space-y-4">
                    <input id="lessonTitle" type="text" placeholder="عنوان الحصة (مثلاً: شرح النحو)" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none focus:border-blue-500 text-right"/>
                    <input id="lessonVideo" type="text" placeholder="رابط فيديو اليوتيوب" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none focus:border-blue-500 text-right"/>
                    <select id="lessonGrade" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl outline-none text-right">
                        <option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option>
                    </select>
                    <div class="flex gap-3">
                        <button onclick="addLesson()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">حفظ الحصة</button>
                        <button onclick="hideAddLesson()" class="px-6 py-3 bg-gray-100 text-gray-600 rounded-xl font-bold">إلغاء</button>
                    </div>
                </div>
            </div>
            <div id="lessonsList" class="space-y-3"></div>
        </div>

        <div id="tab-content-codes" class="hidden">
            <h2 class="text-xl font-black text-gray-800 mb-6">الأكواد الجديدة للطلاب</h2>
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-blue-100 mb-6">
                <p class="text-sm text-gray-500 mb-4">اضغط لتوليد كود عشوائي للطالب:</p>
                <button onclick="generateCode()" class="w-full py-4 bg-green-600 text-white rounded-xl font-bold text-lg">توليد كود جديد 🚀</button>
                <div id="generatedCodeDisplay" class="hidden mt-6 p-6 bg-green-50 border-2 border-dashed border-green-300 rounded-2xl text-center">
                    <p class="text-xs text-green-600 font-bold mb-1">انسخ هذا الكود وابعته للطالب:</p>
                    <p id="generatedCodeText" class="text-4xl font-black text-green-800 tracking-widest"></p>
                </div>
            </div>
            <div id="codesList" class="space-y-3"></div>
        </div>
    </main>
</div>

<script>
const ADMIN_PASSWORD = "12341234";

function getData(k) { try { return JSON.parse(localStorage.getItem(k)) || []; } catch { return []; } }
function saveData(k, d) { localStorage.setItem(k, JSON.stringify(d)); }

function adminLogin() {
    const p = document.getElementById('passwordInput').value;
    if (p === ADMIN_PASSWORD) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('adminDashboard').classList.remove('hidden');
        loadLessons();
    } else {
        document.getElementById('loginError').classList.remove('hidden');
    }
}

function adminLogout() {
    location.reload();
}

function showTab(t) {
    ['lessons', 'codes', 'students'].forEach(x => {
        const content = document.getElementById('tab-content-' + x);
        const tab = document.getElementById('tab-' + x);
        if(content) content.classList.add('hidden');
        if(tab) tab.classList.remove('text-blue-600', 'border-b-2', 'border-blue-600');
    });
    document.getElementById('tab-content-' + t).classList.remove('hidden');
    document.getElementById('tab-' + t).classList.add('text-blue-600', 'border-b-2', 'border-blue-600');
    if(t === 'lessons') loadLessons();
    if(t === 'codes') loadCodes();
}

function showAddLesson() { document.getElementById('addLessonForm').classList.remove('hidden'); }
function hideAddLesson() { document.getElementById('addLessonForm').classList.add('hidden'); }

function addLesson() {
    const t = document.getElementById('lessonTitle').value;
    const v = document.getElementById('lessonVideo').value;
    const g = document.getElementById('lessonGrade').value;
    if(!t || !v) return alert('برجاء إدخال اسم الحصة ورابط الفيديو');
    const l = getData('lessons');
    l.push({id: Date.now(), title: t, video: v, grade: g});
    saveData('lessons', l);
    hideAddLesson();
    loadLessons();
}

function loadLessons() {
    const l = getData('lessons');
    const list = document.getElementById('lessonsList');
    if(l.length === 0) { list.innerHTML = '<p class="text-center text-gray-400">لا توجد دروس حالياً</p>'; return; }
    list.innerHTML = l.map(x => `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
            <div>
                <p class="font-bold text-gray-800">${x.title}</p>
                <p class="text-xs text-blue-500">${x.grade}</p>
            </div>
            <button class="text-red-500 text-sm font-bold" onclick="deleteLesson(${x.id})">حذف</button>
        </div>
    `).join('');
}

function deleteLesson(id) {
    if(!confirm('هل أنت متأكد من حذف هذه الحصة؟')) return;
    let l = getData('lessons');
    l = l.filter(x => x.id !== id);
    saveData('lessons', l);
    loadLessons();
}

function generateCode() {
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    const c = getData('codes');
    c.push({code, used: false, date: new Date().toLocaleDateString('ar-EG')});
    saveData('codes', c);
    document.getElementById('generatedCodeText').textContent = code;
    document.getElementById('generatedCodeDisplay').classList.remove('hidden');
    loadCodes();
}

function loadCodes() {
    const c = getData('codes');
    const list = document.getElementById('codesList');
    if(c.length === 0) return;
    list.innerHTML = c.reverse().map(x => `
        <div class="bg-white p-3 rounded-lg border flex justify-between items-center">
            <span class="font-mono font-bold text-blue-700">${x.code}</span>
            <span class="text-xs text-gray-400">${x.date}</span>
        </div>
    `).join('');
}
</script>
</body>
  </html>
