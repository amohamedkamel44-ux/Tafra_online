<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>إدارة الطفرة أونلاين</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
    body { font-family: 'Almarai', sans-serif; background: #f8fafc; color: #1e293b; }
    .sidebar { background: #0f172a; color: white; }
    .nav-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 0.75rem; margin-bottom: 0.5rem; transition: 0.3s; }
    .nav-btn:hover, .nav-btn.active { background: #334155; color: #fbbf24; }
</style>
</head>
<body class="flex min-h-screen">

<div class="sidebar w-64 p-6 hidden md:block">
    <h1 class="text-2xl font-black mb-8 gold-text">لوحة الإدارة</h1>
    <nav>
        <button onclick="showTab('lessons')" class="nav-btn active">📚 إدارة الحصص</button>
        <button onclick="showTab('codes')" class="nav-btn">🔑 الأكواد</button>
        <button onclick="showTab('users')" class="nav-btn">👥 الطلاب المسجلين</button>
        <button onclick="showTab('questions')" class="nav-btn">💬 الأسئلة</button>
    </nav>
</div>

<main class="flex-1 p-8">
    <div id="tab-lessons" class="tab-content">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">الحصص المرفوعة</h2>
            <button onclick="openModal()" class="bg-blue-600 text-white px-6 py-2 rounded-xl">+ إضافة حصة</button>
        </div>
        <div id="lessonsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>

    <div id="tab-users" class="tab-content hidden">
        <h2 class="text-2xl font-bold mb-6">قائمة الطلاب</h2>
        <div class="bg-white rounded-2xl shadow overflow-hidden">
            <table class="w-full text-right">
                <thead class="bg-slate-50 border-b">
                    <tr>
                        <th class="p-4">الاسم</th><th class="p-4">الموبايل</th><th class="p-4">ولي الأمر</th><th class="p-4">السنة</th>
                    </tr>
                </thead>
                <tbody id="usersList"></tbody>
            </table>
        </div>
    </div>

    <div id="tab-questions" class="tab-content hidden">
        <h2 class="text-2xl font-bold mb-6">أسئلة الطلاب المنتظرة</h2>
        <div id="adminQsList" class="space-y-4"></div>
    </div>
</main>

<script>
// الوظائف البرمجية (JavaScript) لإدارة البيانات والردود
function getData(k){ return JSON.parse(localStorage.getItem(k)) || []; }
function saveData(k,d){ localStorage.setItem(k, JSON.stringify(d)); }

function showTab(tab){
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.getElementById('tab-' + tab).classList.remove('hidden');
    if(tab === 'users') loadUsers();
    if(tab === 'questions') loadAdminQs();
}

function loadUsers(){
    const users = getData('tafra_users');
    document.getElementById('usersList').innerHTML = users.map(u => `
        <tr class="border-b">
            <td class="p-4 font-bold">${u.name}</td>
            <td class="p-4">${u.phone}</td>
            <td class="p-4">${u.parent}</td>
            <td class="p-4 text-blue-600">${u.grade}</td>
        </tr>
    `).join('');
}

function loadAdminQs(){
    const qs = getData('questions').filter(q => !q.reply);
    document.getElementById('adminQsList').innerHTML = qs.map(q => `
        <div class="bg-white p-6 rounded-2xl shadow-sm border">
            <p class="text-sm text-blue-500 mb-2">${q.student}:</p>
            <p class="mb-4">${q.text}</p>
            <div class="flex gap-2">
                <input id="rep-${q.id}" type="text" placeholder="اكتب الرد هنا..." class="flex-1 border p-2 rounded-lg"/>
                <button onclick="sendReply(${q.id})" class="bg-green-600 text-white px-4 rounded-lg">رد</button>
            </div>
        </div>
    `).join('');
}

function sendReply(id){
    const txt = document.getElementById('rep-'+id).value;
    let qs = getData('questions');
    qs = qs.map(q => q.id == id ? {...q, reply: txt} : q);
    saveData('questions', qs);
    loadAdminQs();
}
</script>
</body>
</html>
