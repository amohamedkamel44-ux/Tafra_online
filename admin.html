<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الطفرة - ميس ندى كامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 font-[Cairo]">

    <nav class="bg-blue-800 text-white p-4 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="font-bold text-xl">إدارة منصة الطفرة 🛡️</h1>
            <span class="text-sm">لوحة التحكم السريعة</span>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto p-6">
        <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-100">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">إضافة محاضرة جديدة ✨</h2>
            
            <div class="space-y-5">
                <div>
                    <label class="block text-gray-600 mb-2 font-bold">عنوان المحاضرة</label>
                    <input id="vTitle" type="text" placeholder="مثال: الحصة الأولى - أساسيات اللغة" class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-gray-600 mb-2 font-bold">رابط فيديو اليوتيوب</label>
                    <input id="vUrl" type="text" placeholder="https://www.youtube.com/watch?v=..." class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:border-blue-500 transition">
                </div>

                <div>
                    <label class="block text-gray-600 mb-2 font-bold">وصف قصير</label>
                    <textarea id="vDesc" placeholder="اكتب ما سيتم شرحه في الحصة..." class="w-full p-4 bg-gray-50 border rounded-2xl outline-none focus:border-blue-500 transition h-24"></textarea>
                </div>

                <button onclick="uploadLesson()" id="upBtn" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg hover:bg-blue-700 shadow-lg shadow-blue-200 transition">نشر المحاضرة للطلاب الآن 🚀</button>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // نفس مفاتيح الربط بتاعتك
        const firebaseConfig = {
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ",
            authDomain: "tafra-online.firebaseapp.com",
            projectId: "tafra-online",
            storageBucket: "tafra-online.firebaseapp.com",
            messagingSenderId: "715653554628",
            appId: "1:715653554628:web:24ce873f34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.uploadLesson = async () => {
            const title = document.getElementById('vTitle').value;
            const url = document.getElementById('vUrl').value;
            const description = document.getElementById('vDesc').value;
            const btn = document.getElementById('upBtn');

            if(!title || !url) return alert('برجاء كتابة العنوان والرابط!');

            btn.innerText = "جاري النشر... ⏳";
            btn.disabled = true;

            try {
                await addDoc(collection(db, "lessons"), {
                    title: title,
                    url: url,
                    description: description,
                    createdAt: new Date()
                });
                alert('تم نشر المحاضرة بنجاح! سيراها الطلاب الآن ✅');
                location.reload();
            } catch (e) {
                alert('حدث خطأ، تأكد من تفعيل Firestore في Firebase');
                console.error(e);
            }
            btn.innerText = "نشر المحاضرة للطلاب الآن 🚀";
            btn.disabled = false;
        }
    </script>
</body>
</html>
