<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة - ميس ندى كامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: white; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-primary { background: linear-gradient(90deg, #2563eb, #7c3aed); transition: 0.3s; }
        .btn-primary:hover { opacity: 0.9; transform: scale(1.02); }
        .locked-card { filter: grayscale(0.8); opacity: 0.7; }
    </style>
</head>
<body>

    <div id="loginPage" class="fixed inset-0 z-[100] bg-[#0f172a] flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2rem] w-full max-w-md text-center">
            <div class="w-20 h-20 bg-blue-600 rounded-full mx-auto mb-6 flex items-center justify-center text-3xl shadow-lg shadow-blue-500/50">🔬</div>
            <h1 class="text-3xl font-black mb-2">منصة الطفرة</h1>
            <p class="text-gray-400 mb-8 font-bold">مع ميس ندى كامل - ملكة العلوم</p>
            <input id="stuName" type="text" placeholder="اسمك الثلاثي يا بطل" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 mb-4 outline-none focus:border-blue-500 text-center">
            <input id="stuPhone" type="tel" placeholder="رقم الموبايل" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 mb-6 outline-none focus:border-blue-500 text-center">
            <button onclick="login()" class="w-full btn-primary p-4 rounded-2xl font-bold text-lg shadow-xl">دخول المنصة 🚀</button>
        </div>
    </div>

    <div id="mainContent" class="hidden min-h-screen">
        <nav class="p-6 flex justify-between items-center glass sticky top-0 z-40">
            <div class="flex items-center gap-3">
                <span class="text-2xl">🧬</span>
                <span class="font-black text-xl tracking-tighter">AL-TAFRA</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="welcomeMsg" class="text-sm font-bold text-blue-400"></span>
                <button onclick="toggleAdmin()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center">⚙️</button>
            </div>
        </nav>

        <header class="p-8 max-w-6xl mx-auto">
            <div class="grid md:grid-cols-4 gap-4 mb-12">
                <div class="glass p-6 rounded-3xl text-center border-b-4 border-blue-500">
                    <h3 class="text-gray-400 text-xs mb-1">الفيزياء</h3>
                    <p class="font-black text-xl">40 حصة</p>
                </div>
                <div class="glass p-6 rounded-3xl text-center border-b-4 border-green-500">
                    <h3 class="text-gray-400 text-xs mb-1">الكيمياء</h3>
                    <p class="font-black text-xl">35 حصة</p>
                </div>
                <div class="glass p-6 rounded-3xl text-center border-b-4 border-purple-500">
                    <h3 class="text-gray-400 text-xs mb-1">الأحياء</h3>
                    <p class="font-black text-xl">45 حصة</p>
                </div>
                <div class="glass p-6 rounded-3xl text-center border-b-4 border-yellow-500">
                    <h3 class="text-gray-400 text-xs mb-1">بنك الأسئلة</h3>
                    <p class="font-black text-xl">1000+</p>
                </div>
            </div>

            <div id="adminPanel" class="hidden glass p-8 rounded-[2.5rem] mb-12 border-orange-500/50">
                <h2 class="text-2xl font-bold mb-6 text-orange-400">إضافة محاضرة جديدة 🧪</h2>
                <div class="grid md:grid-cols-3 gap-4">
                    <input id="vTitle" type="text" placeholder="عنوان المحاضرة" class="p-4 rounded-2xl bg-white/5 border border-white/10 outline-none">
                    <input id="vUrl" type="text" placeholder="رابط يوتيوب" class="p-4 rounded-2xl bg-white/5 border border-white/10 outline-none">
                    <input id="vCode" type="text" placeholder="كود التفعيل (مثلاً: 123)" class="p-4 rounded-2xl bg-white/5 border border-white/10 outline-none">
                    <button id="addBtn" class="md:col-span-3 btn-primary p-4 rounded-2xl font-bold">رفع المحاضرة الآن</button>
                </div>
            </div>

            <h2 class="text-3xl font-black mb-8 flex items-center gap-4">
                <span class="w-3 h-10 bg-blue-600 rounded-full"></span>
                محاضرات العلوم المتاحة
            </h2>

            <div id="lessonsList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8 text-right">
                </div>
        </header>
    </div>

    <div id="playerModal" class="fixed inset-0 z-[200] bg-black/95 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-4xl">
            <div id="unlockZone" class="text-center p-8 glass rounded-[2rem]">
                <h3 class="text-2xl font-bold mb-4">هذه المحاضرة مقفولة 🔒</h3>
                <p class="text-gray-400 mb-6">برجاء إدخال كود التفعيل الذي استلمته من الميس</p>
                <input id="activationCode" type="text" placeholder="اكتب الكود هنا" class="w-full max-w-xs p-4 rounded-2xl bg-white/10 border border-white/20 mb-6 text-center text-2xl font-bold outline-none">
                <div class="flex gap-4 justify-center">
                    <button onclick="checkCode()" class="btn-primary px-8 py-4 rounded-2xl font-bold">تفعيل ومشاهدة</button>
                    <button onclick="closePlayer()" class="bg-white/10 px-8 py-4 rounded-2xl font-bold">إغلاق</button>
                </div>
            </div>
            <div id="videoZone" class="hidden">
                <div class="relative pt-[56.25%]">
                    <div id="videoIframe" class="absolute inset-0 w-full h-full rounded-[2rem] overflow-hidden"></div>
                </div>
                <button onclick="closePlayer()" class="mt-6 text-gray-400 font-bold underline w-full">إغلاق الفيديو</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ",
            authDomain: "tafra-online.firebaseapp.com",
            databaseURL: "https://tafra-online-default-rtdb.firebaseio.com",
            projectId: "tafra-online",
            storageBucket: "tafra-online.firebaseapp.com",
            messagingSenderId: "715653554628",
            appId: "1:715653554628:web:24ce873f34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentLessonCode = "";
        let currentLessonUrl = "";

        // دخول الطالب
        window.login = () => {
            const name = document.getElementById('stuName').value;
            if(name.length < 5) return alert("اكتب اسمك الحقيقي يا بطل!");
            localStorage.setItem('studentName', name);
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('welcomeMsg').innerText = "مرحباً: " + name;
        };

        // لوحة الأدمن
        window.toggleAdmin = () => {
            if(prompt("كلمة سر الإدارة:") === "tafra2026") {
                document.getElementById('adminPanel').classList.toggle('hidden');
            }
        };

        // رفع محاضرة
        document.getElementById('addBtn').onclick = () => {
            const title = document.getElementById('vTitle').value;
            const url = document.getElementById('vUrl').value;
            const code = document.getElementById('vCode').value;
            if(title && url && code) {
                push(ref(db, 'lessons'), { title, url, code, type: 'علوم' });
                alert("تم النشر بنجاح!");
            }
        };

        // جلب المحاضرات
        onValue(ref(db, 'lessons'), (snapshot) => {
            const list = document.getElementById('lessonsList');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const lesson = child.val();
                list.innerHTML += `
                    <div class="glass p-6 rounded-[2.5rem] relative group cursor-pointer border border-white/5 hover:border-blue-500/50 transition shadow-2xl overflow-hidden" onclick="requestAccess('${lesson.url}', '${lesson.code}')">
                        <div class="absolute top-0 right-0 p-4"><span class="bg-blue-600/20 text-blue-400 text-[10px] px-3 py-1 rounded-full font-black uppercase">Lecture</span></div>
                        <div class="w-16 h-16 bg-white/5 rounded-2xl mb-6 flex items-center justify-center text-3xl group-hover:bg-blue-600 transition-colors">📽️</div>
                        <h3 class="text-xl font-black mb-4 leading-tight">${lesson.title}</h3>
                        <div class="flex items-center justify-between mt-auto">
                            <span class="text-gray-500 text-xs font-bold">مادة العلوم 🧪</span>
                            <span class="text-blue-500 font-bold flex items-center gap-2">فتح المحاضرة 🔒</span>
                        </div>
                    </div>
                `;
            });
        });

        window.requestAccess = (url, code) => {
            currentLessonCode = code;
            currentLessonUrl = url;
            document.getElementById('playerModal').classList.remove('hidden');
            document.getElementById('unlockZone').classList.remove('hidden');
            document.getElementById('videoZone').classList.add('hidden');
        };

        window.checkCode = () => {
            const input = document.getElementById('activationCode').value;
            if(input === currentLessonCode) {
                document.getElementById('unlockZone').classList.add('hidden');
                document.getElementById('videoZone').classList.remove('hidden');
                const vId = currentLessonUrl.split('v=')[1];
                document.getElementById('videoIframe').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${vId}?rel=0" frameborder="0" allowfullscreen></iframe>`;
            } else {
                alert("الكود غلط! كلم الميس يا بطل.");
            }
        };

        window.closePlayer = () => {
            document.getElementById('playerModal').classList.add('hidden');
            document.getElementById('videoIframe').innerHTML = '';
            document.getElementById('activationCode').value = '';
        };

        // التحقق من الجلسة
        if(localStorage.getItem('studentName')) {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('welcomeMsg').innerText = "مرحباً: " + localStorage.getItem('studentName');
        }
    </script>
</body>
</html>
