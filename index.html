<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Tafra Online | منصة الطفرة - ميس ندى كامل</title>
    <meta name="description" content="المنصة الرسمية لميس ندى كامل - شرح العلوم والكيمياء للمرحلة الإعدادية والثانوية. محاضرات محمية ونظام متابعة متطور.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #1e293b; user-select: none; margin: 0; }
        .main-gradient { background: linear-gradient(135deg, #00d2ff, #3a7bd5); }
        .text-gradient { background: linear-gradient(to right, #00b4db, #0083b0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-enter { background: linear-gradient(to right, #00d2ff, #3a7bd5); color: white; padding: 18px 60px; border-radius: 50px; font-weight: bold; font-size: 20px; transition: 0.3s; box-shadow: 0 10px 20px rgba(58, 123, 213, 0.3); border: none; cursor: pointer; }
        .btn-enter:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(58, 123, 213, 0.4); }
        .glass-dark { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .input-field { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; outline: none; margin-bottom: 15px; transition: 0.3s; }
        .input-field:focus { border-color: #3a7bd5; box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.1); }
        .watermark { position: absolute; color: rgba(255,255,255,0.15); pointer-events: none; z-index: 1000; font-weight: bold; font-size: 14px; animation: move 15s infinite linear; white-space: nowrap; }
        @keyframes move { 0% { top: 10%; left: 10%; } 50% { top: 80%; left: 70%; } 100% { top: 10%; left: 10%; } }
        .hidden { display: none; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="welcomeScreen" class="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-white">
        <div class="w-28 h-28 main-gradient rounded-[30px] flex items-center justify-center mb-8 shadow-xl">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M10 2v7.5M14 2v7.5M8.5 2h7M21 22H3l7-12.5V2h4v7.5L21 22z"/></svg>
        </div>
        <h1 class="text-3xl font-bold text-slate-800 mb-2">أهلاً بك في منصة</h1>
        <h2 class="text-5xl font-black text-gradient mb-6">الطفرة اونلاين</h2>
        <p class="text-gray-400 text-lg mb-12 max-w-xs font-bold leading-relaxed">منصتك لتعلم العلوم بطريقة مبتكرة وممتعة مع ميس ندى كامل</p>
        
        <button onclick="showAuth()" class="btn-enter">اضغط هنا للدخول</button>
        <div onclick="openAdmin()" class="mt-8 text-gray-300 text-sm cursor-pointer hover:text-blue-400 transition">دخول الإدارة</div>
    </div>

    <div id="authScreen" class="hidden min-h-screen bg-slate-50 flex items-center justify-center p-6">
        <div class="w-full max-w-md bg-white p-8 rounded-[2.5rem] shadow-2xl text-center border border-slate-100">
            <h3 class="text-2xl font-bold mb-6 text-slate-800">تسجيل دخول الطالب</h3>
            <input id="stuPhone" type="tel" placeholder="رقم الموبايل" class="input-field">
            <input id="stuPass" type="password" placeholder="كلمة المرور" class="input-field">
            <button onclick="handleLogin()" class="btn-enter w-full mt-4">دخول</button>
            <p onclick="location.reload()" class="mt-6 text-sm text-blue-500 cursor-pointer font-bold">← العودة للرئيسية</p>
        </div>
    </div>

    <div id="mainPlatform" class="hidden min-h-screen bg-slate-900 text-white p-4">
        <nav class="flex justify-between items-center p-4 glass-dark rounded-2xl mb-8">
            <span class="font-black italic text-blue-400">TAFRA ONLINE</span>
            <div class="flex items-center gap-4">
                <span id="stName" class="text-xs font-bold text-blue-200"></span>
                <button onclick="logout()" class="text-red-400 text-xs bg-red-900/20 px-3 py-1 rounded-lg">خروج</button>
            </div>
        </nav>

        <div class="grid grid-cols-2 gap-2 mb-8 bg-white/5 p-1 rounded-2xl">
            <button onclick="switchTab('lessons')" id="t-lessons" class="py-3 rounded-xl bg-blue-600 font-bold transition">المحاضرات</button>
            <button onclick="switchTab('hw')" id="t-hw" class="py-3 rounded-xl font-bold transition">الواجبات</button>
        </div>

        <div id="tab-lessons" class="grid gap-6">
            </div>

        <div id="tab-hw" class="hidden max-w-md mx-auto text-center py-10">
            <h3 class="text-2xl font-bold mb-6 text-blue-400">تسليم الواجب 📝</h3>
            <input id="hwTitle" type="text" placeholder="اسم الدرس" class="input-field text-slate-900">
            <textarea id="hwBody" placeholder="اكتب الحل هنا أو رابط ملف الحل" class="input-field text-slate-900 h-40"></textarea>
            <button onclick="sendHw()" class="btn-enter w-full">إرسال للميس ✅</button>
        </div>
    </div>

    <div id="videoModal" class="hidden fixed inset-0 z-[5000] bg-black/98 flex items-center justify-center p-4">
        <div class="w-full max-w-4xl relative">
            <div id="lockZone" class="text-center p-12 bg-slate-800 rounded-[3rem] border border-slate-700">
                <div class="text-6xl mb-6">🔐</div>
                <h3 class="text-xl font-bold mb-6">أدخل كود تفعيل الحصة للمشاهدة</h3>
                <input id="vCode" type="text" placeholder="الكود" class="input-field text-center text-slate-900 text-2xl font-bold max-w-xs tracking-widest">
                <button onclick="verifyVideo()" class="btn-enter w-full mt-4">فتح الفيديو الآن</button>
                <button onclick="closeVid()" class="mt-4 text-gray-500 block w-full">إلغاء</button>
            </div>
            <div id="videoZone" class="hidden relative rounded-[2rem] overflow-hidden border-2 border-blue-600">
                <div class="watermark" id="wm"></div>
                <div id="player" class="aspect-video bg-black"></div>
                <button onclick="closeVid()" class="mt-4 text-gray-400 w-full hover:text-white transition">إغلاق المشغل</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = { 
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ", 
            databaseURL: "https://tafra-online-default-rtdb.firebaseio.com", 
            projectId: "tafra-online" 
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let user = null; 
        let curCode = ""; 
        let curUrl = "";

        // الحماية من الاختصارات
        document.onkeydown = (e) => { if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false; };

        // وظائف التنقل
        window.showAuth = () => { 
            document.getElementById('welcomeScreen').classList.add('hidden'); 
            document.getElementById('authScreen').classList.remove('hidden'); 
        };
        
        window.openAdmin = () => { 
            if(prompt("كلمة سر الإدارة العليا:") === "Rtslanme 44") {
                alert("أهلاً بكِ ميس ندى. يمكنك التحكم في المحتوى عبر لوحة Firebase.");
            } else {
                alert("كلمة سر خاطئة!");
            }
        };

        window.handleLogin = () => {
            const ph = document.getElementById('stuPhone').value;
            const ps = document.getElementById('stuPass').value;
            if(!ph || !ps) return alert("من فضلك أدخل البيانات");

            get(child(ref(db), 'users/' + ph)).then(s => {
                if(s.exists() && s.val().pass === ps) {
                    localStorage.setItem('tafra_user', JSON.stringify(s.val()));
                    location.reload();
                } else {
                    alert("رقم الموبايل أو كلمة السر غير صحيحة!");
                }
            });
        };

        // فحص الجلسة
        const saved = localStorage.getItem('tafra_user');
        if(saved) {
            user = JSON.parse(saved);
            document.getElementById('welcomeScreen').classList.add('hidden');
            document.getElementById('mainPlatform').classList.remove('hidden');
            document.getElementById('stName').innerText = user.name;
            loadLessons();
        }

        window.switchTab = (t) => {
            document.getElementById('tab-lessons').classList.toggle('hidden', t !== 'lessons');
            document.getElementById('tab-hw').classList.toggle('hidden', t !== 'hw');
            document.getElementById('t-lessons').classList.toggle('bg-blue-600', t === 'lessons');
            document.getElementById('t-hw').classList.toggle('bg-blue-600', t === 'hw');
        };

        function loadLessons() {
            onValue(ref(db, 'lessons'), s => {
                const div = document.getElementById('tab-lessons'); 
                div.innerHTML = '';
                if(!s.exists()) { div.innerHTML = '<p class="text-center text-gray-500">لا توجد دروس مرفوعة حالياً</p>'; return; }
                
                s.forEach(c => {
                    const l = c.val();
                    if(l.year === user.year) {
                        div.innerHTML += `
                            <div onclick="playVid('${l.url}','${l.code}')" class="glass-dark p-6 rounded-3xl border-r-4 border-blue-500 cursor-pointer hover:bg-white/10 transition">
                                <h4 class="font-bold text-lg mb-1">${l.title}</h4>
                                <div class="flex justify-between items-center">
                                    <p class="text-xs text-blue-400">شاهد المحاضرة 🔐</p>
                                    <span class="text-[10px] text-gray-500 italic">ميس ندى كامل</span>
                                </div>
                            </div>`;
                    }
                });
            });
        }

        window.playVid = (u, c) => { 
            curUrl = u; 
            curCode = c; 
            document.getElementById('videoModal').classList.remove('hidden'); 
        };

        window.verifyVideo = () => {
            if(document.getElementById('vCode').value === curCode) {
                document.getElementById('lockZone').classList.add('hidden');
                document.getElementById('videoZone').classList.remove('hidden');
                const vidId = curUrl.split('v=')[1]?.split('&')[0];
                document.getElementById('player').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${vidId}?rel=0&modestbranding=1" frameborder="0" allowfullscreen></iframe>`;
                document.getElementById('wm').innerText = `${user.name} - ${user.phone} - TAFRA`;
            } else {
                alert("كود التفعيل غير صحيح!");
            }
        };

        window.sendHw = () => {
            const title = document.getElementById('hwTitle').value;
            const body = document.getElementById('hwBody').value;
            if(!title || !body) return alert("اكمل بيانات الواجب!");

            push(ref(db, 'homeworks'), { 
                student: user.name, 
                phone: user.phone,
                lesson: title, 
                content: body,
                date: new Date().toLocaleString('ar-EG')
            }).then(() => { 
                alert("تم تسليم الواجب بنجاح للميس ندى ✅"); 
                document.getElementById('hwTitle').value = '';
                document.getElementById('hwBody').value = '';
                switchTab('lessons'); 
            });
        };

        window.closeVid = () => { 
            document.getElementById('videoModal').classList.add('hidden'); 
            document.getElementById('player').innerHTML = ''; 
            document.getElementById('lockZone').classList.remove('hidden'); 
            document.getElementById('videoZone').classList.add('hidden'); 
            document.getElementById('vCode').value = '';
        };

        window.logout = () => { 
            localStorage.clear(); 
            location.reload(); 
        };
    </script>
</body>
</html>
