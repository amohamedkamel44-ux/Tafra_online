<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة أونلاين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .lesson-card { transition: all 0.3s ease; }
        .lesson-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="bg-blue-900 text-white p-4 shadow-xl sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">الطفرة أونلاين ✨</h1>
            <button onclick="toggleAdmin()" class="text-xs bg-blue-700 px-3 py-1 rounded-lg">دخول المعلم</button>
        </div>
    </nav>

    <div class="max-w-2xl mx-auto p-4">
        
        <div id="adminPanel" class="hidden bg-white p-6 rounded-3xl shadow-lg mb-8 border-2 border-orange-400">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-orange-600">إضافة حصة جديدة 🛠️</h3>
                <button onclick="document.getElementById('adminPanel').classList.add('hidden')" class="text-gray-400">إغلاق</button>
            </div>
            <div class="space-y-3">
                <input id="vTitle" type="text" placeholder="عنوان الحصة" class="w-full p-3 border rounded-xl outline-none focus:border-orange-400">
                <input id="vUrl" type="text" placeholder="رابط فيديو اليوتيوب" class="w-full p-3 border rounded-xl outline-none focus:border-orange-400">
                <button id="addBtn" class="w-full bg-orange-500 text-white p-3 rounded-xl font-bold hover:bg-orange-600 transition">نشر الحصة الآن 🚀</button>
            </div>
        </div>

        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-xl font-bold text-gray-800">الحصص المتاحة 📚</h2>
        </div>

        <div id="lessonsList" class="grid gap-4">
            <div class="text-center p-10 text-gray-400">جاري تحميل المحاضرات...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // بياناتك من Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ",
            authDomain: "tafra-online.firebaseapp.com",
            databaseURL: "https://tafra-online-default-rtdb.firebaseio.com",
            projectId: "tafra-online",
            storageBucket: "tafra-online.firebaseapp.com",
            messagingSenderId: "715653554628",
            appId: "1:715653554628:web:24ce873f34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // وظيفة إظهار لوحة الأدمن بكلمة سر
        window.toggleAdmin = () => {
            const password = prompt("برجاء إدخال كلمة سر الإدارة:");
            if (password === "tafra2026") { // دي كلمة السر تقدر تغيرها
                document.getElementById('adminPanel').classList.remove('hidden');
            } else {
                alert("عفواً! كلمة السر غير صحيحة.");
            }
        };

        // إضافة حصة
        document.getElementById('addBtn').onclick = () => {
            const title = document.getElementById('vTitle').value;
            const url = document.getElementById('vUrl').value;
            if(title && url) {
                push(ref(db, 'lessons'), { 
                    title: title, 
                    url: url,
                    time: new Date().toLocaleDateString('ar-EG')
                }).then(() => {
                    alert("تم النشر بنجاح!");
                    document.getElementById('vTitle').value = '';
                    document.getElementById('vUrl').value = '';
                });
            }
        };

        // عرض الحصص
        onValue(ref(db, 'lessons'), (snapshot) => {
            const list = document.getElementById('lessonsList');
            list.innerHTML = '';
            if(!snapshot.exists()) {
                list.innerHTML = '<div class="text-center p-10 text-gray-400">لا توجد حصص بعد.</div>';
                return;
            }
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `
                    <div class="lesson-card bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex justify-between items-center">
                        <div>
                            <h4 class="font-bold text-gray-800 text-lg">${data.title}</h4>
                            <p class="text-gray-400 text-xs mt-1">${data.time}</p>
                        </div>
                        <button onclick="window.open('${data.url}', '_blank')" class="bg-blue-600 text-white px-6 py-2 rounded-2xl font-bold">
                            مشاهدة
                        </button>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
