<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة | ميس ندى كامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00bcd4; --bg: #f0f2f5; }
        * { -webkit-user-select: none; user-select: none; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); margin: 0; }
        .category-card { background: white; border-radius: 25px; padding: 25px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; cursor: pointer; border: 1px solid #fff; }
        .category-card:hover { transform: translateY(-5px); border-color: var(--main); box-shadow: 0 10px 15px rgba(0,188,212,0.1); }
        .hidden { display: none !important; }
        .lecture-item { background: white; border-radius: 18px; margin-bottom: 12px; border-right: 6px solid var(--main); padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        @media print { body { display:none; } }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="authPage" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white p-8 rounded-[35px] shadow-2xl">
            <div id="loginForm" class="text-center">
                <h1 class="text-3xl font-black text-cyan-600 mb-8">الطفرة أونلاين 🧪</h1>
                <input id="l-phone" type="tel" placeholder="رقم الموبايل" class="w-full p-4 rounded-2xl border bg-gray-50 mb-4 outline-none focus:ring-2 ring-cyan-400">
                <input id="l-pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-2xl border bg-gray-50 mb-6 outline-none focus:ring-2 ring-cyan-400">
                <button onclick="login()" class="w-full bg-cyan-500 text-white py-4 rounded-2xl font-black text-lg shadow-lg">دخول الطالب</button>
                <p class="mt-6 text-sm">طالب جديد؟ <span onclick="showForm('reg')" class="text-cyan-600 font-bold cursor-pointer underline">إنشاء حساب</span></p>
                <button onclick="openAdmin()" class="mt-10 text-gray-300 text-[10px]">لوحة التحكم</button>
            </div>
            
            <div id="regForm" class="hidden">
                <h2 class="text-2xl font-black mb-6 text-center">بيانات الطالب الجديد</h2>
                <div class="space-y-3">
                    <input id="r-name" type="text" placeholder="الاسم بالكامل" class="w-full p-3 rounded-xl border bg-gray-50 outline-none">
                    <input id="r-phone" type="tel" placeholder="رقم الموبايل" class="w-full p-3 rounded-xl border bg-gray-50 outline-none">
                    <select id="r-year" class="w-full p-3 rounded-xl border bg-gray-50 font-bold outline-none">
                        <option value="">اختر السنة الدراسية</option>
                        <option>أولى إعدادي</option><option>ثانية إعدادي</option><option>ثالثة إعدادي</option>
                        <option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option>
                    </select>
                    <input id="r-pass" type="password" placeholder="كلمة المرور" class="w-full p-3 rounded-xl border bg-gray-50 outline-none">
                </div>
                <button onclick="register()" class="w-full bg-cyan-500 text-white py-4 rounded-xl font-black mt-6 shadow-md">تأكيد الحساب</button>
                <p class="mt-4 text-center text-sm" onclick="showForm('login')">رجوع للدخول</p>
            </div>
        </div>
    </div>

    <div id="homePage" class="hidden min-h-screen">
        <nav class="bg-white p-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
            <div>
                <span id="u-name" class="font-black text-gray-800"></span>
                <p id="u-year-display" class="text-[10px] text-cyan-600 font-bold"></p>
            </div>
            <button onclick="logout()" class="text-red-500 text-xs font-bold border border-red-100 px-3 py-1 rounded-full">خروج</button>
        </nav>

        <div id="mainGrid" class="p-6 grid grid-cols-2 gap-4">
            <div class="category-card" onclick="showSection('lectures')">
                <div class="text-3xl mb-2">📺</div>
                <h3 class="font-black text-sm">المحاضرات</h3>
            </div>
            <div class="category-card" onclick="alert('تواصل لشحن الأكواد: 01159735573')">
                <div class="text-3xl mb-2">🎟️</div>
                <h3 class="font-black text-sm">شحن أكواد</h3>
            </div>
            <div class="category-card" onclick="alert('الدعم الفني: 01159735573')">
                <div class="text-3xl mb-2">📞</div>
                <h3 class="font-black text-sm">تواصل معنا</h3>
            </div>
            <div class="category-card" onclick="alert('قريباً')">
                <div class="text-3xl mb-2">📚</div>
                <h3 class="font-black text-sm">المذكرات</h3>
            </div>
        </div>

        <div id="lecturesPage" class="hidden p-5">
            <button onclick="showSection('grid')" class="mb-4 text-cyan-600 font-bold flex items-center gap-1"> ⬅️ العودة للرئيسية</button>
            <div id="lecturesList" class="space-y-4"></div>
        </div>
    </div>

    <div id="adminPage" class="hidden min-h-screen bg-white p-6">
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <h2 class="text-2xl font-black">لوحة تحكم الأكواد والدروس 👑</h2>
            <button onclick="location.reload()" class="bg-red-500 text-white px-4 py-1 rounded-lg text-sm">إغلاق</button>
        </div>
        
        <div class="bg-slate-100 p-6 rounded-3xl mb-8 border border-slate-200">
            <h3 class="font-bold mb-4 text-cyan-700">🎟️ توليد أكواد جديدة</h3>
            <div class="flex gap-2 mb-4">
                <input id="codesCount" type="number" placeholder="عدد الأكواد" class="w-1/2 p-3 rounded-xl border">
                <select id="codesYear" class="w-1/2 p-3 rounded-xl border font-bold">
                    <option>أولى إعدادي</option><option>ثانية إعدادي</option><option>ثالثة إعدادي</option>
                    <option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option>
                </select>
            </div>
            <button onclick="generateCodes()" class="w-full bg-cyan-600 text-white py-3 rounded-xl font-bold shadow-md">توليد وطباعة الأكواد</button>
            <div id="generatedList" class="mt-4 p-4 bg-white rounded-xl border max-h-40 overflow-y-auto text-xs font-mono hidden select-text"></div>
        </div>

        <div class="bg-gray-50 p-6 rounded-3xl border border-gray-200">
            <h3 class="font-bold mb-4 text-gray-700">➕ إضافة فيديو جديد</h3>
            <input id="v-title" placeholder="عنوان الدرس" class="w-full p-3 border rounded-xl mb-2">
            <input id="v-url" placeholder="رابط يوتيوب" class="w-full p-3 border rounded-xl mb-2">
            <select id="v-year" class="w-full p-3 border rounded-xl mb-4 font-bold">
                <option>أولى إعدادي</option><option>ثانية إعدادي</option><option>ثالثة إعدادي</option>
                <option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option>
            </select>
            <button onclick="uploadVideo()" class="w-full bg-slate-800 text-white py-3 rounded-xl font-bold">نشر الفيديو</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ", databaseURL: "https://tafra-online-default-rtdb.firebaseio.com", projectId: "tafra-online" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = JSON.parse(localStorage.getItem('tafra_v7')) || null;

        // حماية الكيبورد
        document.onkeydown = (e) => { if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false; };

        window.login = () => {
            const p = document.getElementById('l-phone').value;
            const s = document.getElementById('l-pass').value;
            get(child(ref(db), 'users/' + p)).then(snap => {
                if(snap.exists() && snap.val().pass === s){
                    localStorage.setItem('tafra_v7', JSON.stringify(snap.val()));
                    location.reload();
                } else alert("بيانات الدخول خطأ!");
            });
        };

        window.register = () => {
            const d = {
                name: document.getElementById('r-name').value,
                phone: document.getElementById('r-phone').value,
                year: document.getElementById('r-year').value,
                pass: document.getElementById('r-pass').value,
                unlocked: {}
            };
            if(!d.name || !d.phone) return alert("اكمل البيانات!");
            set(ref(db, 'users/' + d.phone), d).then(() => { alert("تم التسجيل! سجل دخول الآن."); showForm('login'); });
        };

        window.generateCodes = () => {
            const count = document.getElementById('codesCount').value;
            const year = document.getElementById('codesYear').value;
            let listDiv = document.getElementById('generatedList');
            listDiv.innerHTML = '<b>الأكواد المولدة (انسخها للطباعة):</b><br>';
            listDiv.classList.remove('hidden');
            for(let i=0; i<count; i++) {
                const code = "TF-" + Math.random().toString(36).substr(2, 6).toUpperCase();
                set(ref(db, 'codes/' + code), { year: year, usedBy: "" });
                listDiv.innerHTML += code + "<br>";
            }
        };

        window.uploadVideo = () => {
            const t = document.getElementById('v-title').value;
            const u = document.getElementById('v-url').value;
            const y = document.getElementById('v-year').value;
            if(t && u) push(ref(db, 'videos'), { title: t, url: u, year: y }).then(() => alert("تم النشر ✅"));
        };

        window.watchVideo = async (videoID, url) => {
            const unlockedRef = child(ref(db), `users/${currentUser.phone}/unlocked/${videoID}`);
            const check = await get(unlockedRef);
            if(check.exists()){
                window.open(url, '_blank');
            } else {
                const code = prompt("الحصة مشفرة.. أدخل كود التفعيل لفتحها:");
                if(!code) return;
                const codeSnap = await get(child(ref(db), 'codes/' + code));
                if(codeSnap.exists()){
                    const cData = codeSnap.val();
                    if(cData.usedBy === "" && cData.year === currentUser.year){
                        await update(ref(db, 'codes/' + code), { usedBy: currentUser.phone });
                        await set(unlockedRef, true);
                        alert("تم تفعيل الحصة بنجاح!");
                        window.open(url, '_blank');
                    } else alert("كود مستخدم، أو غير مخصص لسنتك الدراسية!");
                } else alert("كود غير صحيح!");
            }
        };

        function loadLectures() {
            onValue(ref(db, 'videos'), snap => {
                const list = document.getElementById('lecturesList');
                list.innerHTML = '';
                snap.forEach(c => {
                    const v = c.val();
                    if(v.year === currentUser.year) {
                        list.innerHTML += `
                            <div class="lecture-item shadow-sm">
                                <div><h4 class="font-bold text-gray-800">${v.title}</h4><p class="text-[10px] text-cyan-600">محاضرة معتمدة</p></div>
                                <button onclick="watchVideo('${c.key}', '${v.url}')" class="bg-cyan-500 text-white px-5 py-2 rounded-xl text-xs font-black">🎬 مشاهدة</button>
                            </div>`;
                    }
                });
            });
        }

        if(currentUser) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('homePage').classList.remove('hidden');
            document.getElementById('u-name').innerText = currentUser.name;
            document.getElementById('u-year-display').innerText = currentUser.year;
        }
        window.showSection = (s) => {
            document.getElementById('mainGrid').classList.toggle('hidden', s === 'lectures');
            document.getElementById('lecturesPage').classList.toggle('hidden', s === 'grid');
            if(s === 'lectures') loadLectures();
        }
        window.showForm = (f) => {
            document.getElementById('loginForm').classList.toggle('hidden', f === 'reg');
            document.getElementById('regForm').classList.toggle('hidden', f === 'login');
        }
        window.openAdmin = () => { if(prompt("كلمة سر الميس:") === "Rtslanme 44") { document.getElementById('authPage').classList.add('hidden'); document.getElementById('adminPage').classList.remove('hidden'); } }
        window.logout = () => { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
