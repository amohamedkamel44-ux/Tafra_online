<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة أونلاين | ميس ندى كامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --main: #00bcd4; --bg: #f8fafc; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #333; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid #e2e8f0; }
        .btn-main { background: linear-gradient(90deg, #00bcd4, #00acc1); color: white; transition: 0.3s; }
        .hidden { display: none !important; }
        .admin-table th { background: #f1f5f9; padding: 12px; text-align: right; border-bottom: 2px solid #e2e8f0; }
        .admin-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
    </style>
</head>
<body>

    <div id="authPage" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-lg glass p-8 rounded-[35px] shadow-2xl">
            <div id="loginForm" class="text-center">
                <div class="w-20 h-20 btn-main rounded-2xl mx-auto mb-6 flex items-center justify-center text-3xl shadow-lg">🔬</div>
                <h2 class="text-3xl font-black mb-6">تسجيل الدخول</h2>
                <input id="l-phone" type="tel" placeholder="رقم الموبايل" class="w-full p-4 rounded-2xl border mb-4 outline-none focus:ring-2 ring-cyan-400">
                <input id="l-pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-2xl border mb-6 outline-none focus:ring-2 ring-cyan-400">
                <button onclick="login()" class="btn-main w-full py-4 rounded-2xl font-black text-lg">دخول</button>
                <p class="mt-6">ليس لديك حساب؟ <span onclick="showForm('reg')" class="text-cyan-600 font-bold cursor-pointer underline">أنشئ حسابك</span></p>
                <p onclick="openAdmin()" class="mt-10 text-slate-300 text-xs cursor-pointer">لوحة التحكم</p>
            </div>

            <div id="regForm" class="hidden">
                <h2 class="text-2xl font-black mb-6 text-center">إنشاء حساب طالب جديد 🎓</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-right">
                    <input id="r-name" type="text" placeholder="الاسم بالكامل" class="p-4 rounded-xl border outline-none focus:ring-2 ring-cyan-400">
                    <input id="r-phone" type="tel" placeholder="رقم هاتفك" class="p-4 rounded-xl border outline-none focus:ring-2 ring-cyan-400">
                    <input id="r-parent" type="tel" placeholder="رقم ولي الأمر" class="p-4 rounded-xl border outline-none focus:ring-2 ring-cyan-400">
                    <input id="r-school" type="text" placeholder="اسم مدرستك" class="p-4 rounded-xl border outline-none focus:ring-2 ring-cyan-400">
                    <select id="r-year" class="p-4 rounded-xl border outline-none font-bold col-span-1 md:col-span-2">
                        <option value="">اختر سنتك الدراسية</option>
                        <optgroup label="المرحلة الإعدادية">
                            <option>أولى إعدادي</option><option>ثانية إعدادي</option><option>ثالثة إعدادي</option>
                        </optgroup>
                        <optgroup label="المرحلة الثانوية">
                            <option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option>
                        </optgroup>
                    </select>
                    <input id="r-pass" type="password" placeholder="كلمة المرور" class="p-4 rounded-xl border outline-none focus:ring-2 ring-cyan-400 col-span-1 md:col-span-2">
                </div>
                <button onclick="register()" class="btn-main w-full py-4 rounded-2xl font-black mt-6">تأكيد التسجيل</button>
                <p class="mt-4 text-center" onclick="showForm('login')">لديك حساب؟ <span class="text-cyan-600 font-bold cursor-pointer">سجل دخول</span></p>
            </div>
        </div>
    </div>

    <div id="studentPage" class="hidden min-h-screen">
        <nav class="glass sticky top-0 px-6 py-4 flex justify-between items-center z-50 shadow-sm">
            <div class="flex items-center gap-3">
                <div id="u-icon" class="w-10 h-10 rounded-full btn-main flex items-center justify-center font-bold"></div>
                <span id="u-name" class="font-black text-sm"></span>
            </div>
            <div class="font-black text-xl text-cyan-500 italic">TAFRA</div>
        </nav>
        <div id="studentContent" class="max-w-2xl mx-auto p-4">
            </div>
    </div>

    <div id="adminPage" class="hidden min-h-screen bg-white">
        <div class="bg-slate-900 text-white p-6 flex justify-between items-center">
            <h1 class="text-xl font-black">لوحة تحكم الإدارة 👑</h1>
            <button onclick="location.reload()" class="bg-red-500 px-4 py-2 rounded-lg text-sm">خروج</button>
        </div>

        <div class="p-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div class="p-6 bg-cyan-50 border border-cyan-100 rounded-3xl">
                    <h3 class="text-slate-500 text-sm mb-1">إجمالي الطلاب</h3>
                    <p id="stat-students" class="text-3xl font-black text-cyan-600">0</p>
                </div>
                <div class="p-6 bg-rose-50 border border-rose-100 rounded-3xl">
                    <h3 class="text-slate-500 text-sm mb-1">الطلاب المحظورين</h3>
                    <p id="stat-banned" class="text-3xl font-black text-rose-600">0</p>
                </div>
                <div class="p-6 bg-amber-50 border border-amber-100 rounded-3xl">
                    <h3 class="text-slate-500 text-sm mb-1">إجمالي الحصص</h3>
                    <p id="stat-lessons" class="text-3xl font-black text-amber-600">0</p>
                </div>
            </div>

            <div class="bg-white border rounded-3xl overflow-hidden shadow-sm">
                <div class="p-6 border-b font-black text-lg">قائمة الطلاب والتحكم في الحظر</div>
                <div class="overflow-x-auto">
                    <table class="w-full admin-table text-sm">
                        <thead>
                            <tr>
                                <th>الاسم</th>
                                <th>رقم الطالب</th>
                                <th>ولي الأمر</th>
                                <th>السنة الدراسية</th>
                                <th>المدرسة</th>
                                <th>الحالة</th>
                                <th>الإجراء</th>
                            </tr>
                        </thead>
                        <tbody id="studentsList"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ", databaseURL: "https://tafra-online-default-rtdb.firebaseio.com", projectId: "tafra-online" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- وظائف الواجهة ---
        window.showForm = (f) => {
            document.getElementById('loginForm').classList.toggle('hidden', f === 'reg');
            document.getElementById('regForm').classList.toggle('hidden', f === 'login');
        }

        // --- نظام الطلاب ---
        window.register = () => {
            const data = {
                name: document.getElementById('r-name').value,
                phone: document.getElementById('r-phone').value,
                parent: document.getElementById('r-parent').value,
                school: document.getElementById('r-school').value,
                year: document.getElementById('r-year').value,
                pass: document.getElementById('r-pass').value,
                isBanned: false,
                isPaid: false
            };

            if(!data.name || !data.phone || !data.pass) return alert("اكمل البيانات الأساسية!");

            set(ref(db, 'users/' + data.phone), data).then(() => {
                alert("تم تسجيل حسابك بنجاح! سجل دخول الآن.");
                showForm('login');
            });
        }

        window.login = () => {
            const p = document.getElementById('l-phone').value;
            const s = document.getElementById('l-pass').value;

            get(child(ref(db), 'users/' + p)).then(snap => {
                if(snap.exists()){
                    const u = snap.val();
                    if(u.isBanned) return alert("عفواً، تم حظر حسابك.. تواصل مع الإدارة.");
                    if(u.pass === s) {
                        localStorage.setItem('tafra_user', JSON.stringify(u));
                        location.reload();
                    } else alert("كلمة المرور خطأ!");
                } else alert("الحساب غير موجود!");
            });
        }

        // --- نظام الإدارة (Admin) ---
        window.openAdmin = () => {
            if(prompt("كلمة سر الميس:") === "Rtslanme 44") {
                document.getElementById('authPage').classList.add('hidden');
                document.getElementById('adminPage').classList.remove('hidden');
                loadAdminData();
            }
        }

        function loadAdminData() {
            onValue(ref(db, 'users'), snap => {
                const list = document.getElementById('studentsList');
                list.innerHTML = '';
                let count = 0, banned = 0;

                snap.forEach(childSnap => {
                    const u = childSnap.val();
                    count++;
                    if(u.isBanned) banned++;

                    list.innerHTML += `
                        <tr>
                            <td class="font-bold">${u.name}</td>
                            <td>${u.phone}</td>
                            <td>${u.parent || '---'}</td>
                            <td>${u.year}</td>
                            <td>${u.school || '---'}</td>
                            <td>
                                <span class="${u.isBanned ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'} px-2 py-1 rounded text-xs">
                                    ${u.isBanned ? 'محظور' : 'نشط'}
                                </span>
                            </td>
                            <td>
                                <button onclick="toggleBan('${u.phone}', ${u.isBanned})" class="text-xs font-bold underline ${u.isBanned ? 'text-green-500' : 'text-red-500'}">
                                    ${u.isBanned ? 'إلغاء الحظر' : 'حظر الطالب'}
                                </button>
                            </td>
                        </tr>
                    `;
                });
                document.getElementById('stat-students').innerText = count;
                document.getElementById('stat-banned').innerText = banned;
            });
        }

        window.toggleBan = (phone, currentStatus) => {
            if(confirm("هل أنت متأكد من تغيير حالة هذا الطالب؟")) {
                update(ref(db, 'users/' + phone), { isBanned: !currentStatus });
            }
        }

        // --- تشغيل التطبيق للطالب ---
        const saved = localStorage.getItem('tafra_user');
        if(saved) {
            const u = JSON.parse(saved);
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('studentPage').classList.remove('hidden');
            document.getElementById('u-name').innerText = u.name;
            document.getElementById('u-icon').innerText = u.name[0];
        }
    </script>
</body>
        </html>
