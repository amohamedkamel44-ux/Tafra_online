<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة التعليمية | ميس ندى كامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #050a18; color: white; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-gold { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; transition: 0.3s; }
        .input-style { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 15px; width: 100%; outline: none; text-align: center; }
        .input-style:focus { border-color: #3b82f6; }
        .watermark { position: absolute; color: rgba(255,255,255,0.2); font-size: 14px; pointer-events: none; z-index: 100; animation: move 8s linear infinite; white-space: nowrap; }
        @keyframes move { 0% { top: 10%; left: 10%; } 50% { top: 70%; left: 60%; } 100% { top: 10%; left: 10%; } }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="authPage" class="fixed inset-0 z-[500] bg-[#050a18] flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-lg shadow-2xl">
            <div class="text-center mb-8">
                <div class="text-5xl mb-2">⚛️</div>
                <h1 class="text-3xl font-black text-blue-500">منصة الطفرة</h1>
                <p class="text-gray-400">مستقبلك في العلوم يبدأ من هنا</p>
            </div>

            <div class="flex gap-2 mb-6 bg-white/5 p-1 rounded-2xl">
                <button onclick="showAuth('login')" id="loginTab" class="flex-1 py-2 rounded-xl font-bold bg-blue-600">تسجيل دخول</button>
                <button onclick="showAuth('signup')" id="signupTab" class="flex-1 py-2 rounded-xl font-bold">إنشاء حساب</button>
            </div>

            <div id="loginForm" class="space-y-4">
                <input id="logPhone" type="tel" placeholder="رقم الموبايل" class="input-style">
                <input id="logPass" type="password" placeholder="كلمة المرور" class="input-style">
                <button onclick="handleLogin()" class="w-full btn-gold p-4 rounded-2xl font-black">دخول للمنصة 🚀</button>
            </div>

            <div id="signupForm" class="hidden space-y-3">
                <input id="regName" type="text" placeholder="الاسم الثلاثي" class="input-style">
                <input id="regPhone" type="tel" placeholder="رقم الموبايل" class="input-style">
                <input id="regParent" type="tel" placeholder="رقم ولي الأمر" class="input-style">
                <select id="regLevel" class="input-style bg-gray-800">
                    <option value="prep">المرحلة الإعدادية</option>
                    <option value="sec">المرحلة الثانوية</option>
                </select>
                <input id="regSchool" type="text" placeholder="اسم المدرسة" class="input-style">
                <input id="regPass" type="password" placeholder="اختر كلمة مرور" class="input-style">
                <button onclick="handleSignup()" class="w-full bg-blue-600 p-4 rounded-2xl font-black">إنشاء الحساب الآن ✨</button>
            </div>
        </div>
    </div>

    <div id="mainContent" class="hidden">
        <nav class="p-4 glass sticky top-0 z-50 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="bg-blue-600 px-3 py-1 rounded-lg font-black italic">TAFRA</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-left hidden md:block">
                    <p id="navUserName" class="text-xs font-bold text-blue-400"></p>
                    <p class="text-[10px] text-gray-500 italic">طالب متفوق</p>
                </div>
                <button onclick="logout()" class="text-xs bg-red-900/30 text-red-500 px-3 py-1 rounded-lg">خروج</button>
                <button onclick="toggleAdmin()" class="bg-white/5 w-8 h-8 rounded-full">⚙️</button>
            </div>
        </nav>

        <header class="p-6 max-w-6xl mx-auto">
            <div class="bg-gradient-to-r from-blue-900 to-indigo-900 p-8 rounded-[2rem] mb-8 relative overflow-hidden">
                <div class="relative z-10">
                    <h2 class="text-3xl font-black mb-2">أهلاً بك في رحلة الإبداع 🧬</h2>
                    <p class="text-blue-200">ميس ندى كامل معاك خطوة بخطوة للتقفيل</p>
                </div>
                <div class="absolute -bottom-10 -left-10 text-9xl opacity-10">🔬</div>
            </div>

            <div id="adminPanel" class="hidden glass p-6 rounded-3xl mb-8 border-yellow-500/50">
                <h3 class="text-xl font-bold mb-4 text-yellow-500">لوحة تحكم ميس ندى كامل 👑</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <input id="vTitle" type="text" placeholder="اسم المحاضرة" class="input-style">
                    <input id="vUrl" type="text" placeholder="رابط يوتيوب" class="input-style">
                    <input id="vCode" type="text" placeholder="كود التفعيل" class="input-style">
                    <button id="addBtn" class="md:col-span-3 btn-gold p-3 rounded-xl font-bold">إضافة المحاضرة</button>
                </div>
                <div class="border-t border-white/10 pt-4">
                    <p class="font-bold mb-2">إحصائيات الطلاب:</p>
                    <div id="studentsList" class="text-xs space-y-2 max-h-40 overflow-y-auto"></div>
                </div>
            </div>

            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">محاضراتك القادمة</h3>
                <div class="flex gap-2">
                    <span class="bg-blue-600/20 text-blue-400 px-3 py-1 rounded-full text-[10px] font-bold">علوم</span>
                    <span class="bg-purple-600/20 text-purple-400 px-3 py-1 rounded-full text-[10px] font-bold">كيمياء</span>
                </div>
            </div>

            <div id="lessonsList" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                </div>
        </header>
    </div>

    <div id="playerModal" class="fixed inset-0 z-[600] bg-black/98 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-4xl relative">
            <div id="lockUI" class="text-center p-10 glass rounded-[3rem]">
                <div class="text-6xl mb-4">🔐</div>
                <h3 class="text-2xl font-black mb-2">المحاضرة مغلقة</h3>
                <p class="text-gray-400 mb-6">ادخل كود التفعيل الخاص بهذه الحصة</p>
                <input id="activateInp" type="text" placeholder="أدخل الكود هنا" class="input-style max-w-xs mb-6 text-2xl tracking-[10px]">
                <div class="flex gap-4 justify-center">
                    <button onclick="confirmUnlock()" class="btn-gold px-10 py-4 rounded-2xl font-bold">تفعيل الحصة</button>
                    <button onclick="closePlayer()" class="bg-white/10 px-10 py-4 rounded-2xl font-bold">رجوع</button>
                </div>
            </div>

            <div id="videoUI" class="hidden relative">
                <div id="videoContainer" class="aspect-video bg-black rounded-[2rem] overflow-hidden border-2 border-blue-600 shadow-2xl relative">
                    <div id="wm" class="watermark"></div>
                    <div id="playerFrame" class="w-full h-full"></div>
                </div>
                <button onclick="closePlayer()" class="mt-4 text-gray-500 w-full text-center">إغلاق العرض</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ",
            authDomain: "tafra-online.firebaseapp.com",
            databaseURL: "https://tafra-online-default-rtdb.firebaseio.com",
            projectId: "tafra-online",
            storageBucket: "tafra-online.firebaseapp.com",
            messagingSenderId: "715653554628",
            appId: "1:715653554628:web:24ce873f34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = null;
        let activeVideoUrl = "";
        let activeVideoCode = "";

        // التبديل بين الفورمات
        window.showAuth = (type) => {
            if(type === 'login') {
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('signupForm').classList.add('hidden');
                document.getElementById('loginTab').classList.add('bg-blue-600');
                document.getElementById('signupTab').classList.remove('bg-blue-600');
            } else {
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('signupForm').classList.remove('hidden');
                document.getElementById('signupTab').classList.add('bg-blue-600');
                document.getElementById('loginTab').classList.remove('bg-blue-600');
            }
        };

        // إنشاء حساب
        window.handleSignup = () => {
            const name = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const parent = document.getElementById('regParent').value;
            const level = document.getElementById('regLevel').value;
            const school = document.getElementById('regSchool').value;
            const pass = document.getElementById('regPass').value;

            if(!name || !phone || !pass) return alert("املا كل البيانات يا بطل!");

            set(ref(db, 'users/' + phone), {
                name, phone, parent, level, school, pass, status: 'active'
            }).then(() => {
                alert("تم إنشاء حسابك بنجاح! سجل دخولك الآن.");
                showAuth('login');
            });
        };

        // تسجيل دخول
        window.handleLogin = () => {
            const phone = document.getElementById('logPhone').value;
            const pass = document.getElementById('logPass').value;

            get(child(ref(db), 'users/' + phone)).then((snapshot) => {
                if (snapshot.exists()) {
                    const user = snapshot.val();
                    if(user.status === 'blocked') return alert("عفواً، تم حظرك من المنصة! تواصل مع الإدارة.");
                    if(user.pass === pass) {
                        currentUser = user;
                        localStorage.setItem('tafraUser', JSON.stringify(user));
                        startApp();
                    } else { alert("كلمة المرور غلط!"); }
                } else { alert("الموبايل ده مش متسجل عندنا!"); }
            });
        };

        function startApp() {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('navUserName').innerText = currentUser.name;
            loadLessons();
            loadStudentsForAdmin();
        }

        window.logout = () => {
            localStorage.clear();
            location.reload();
        };

        window.toggleAdmin = () => {
            if(prompt("كلمة سر الإدارة:") === "tafra2026") {
                document.getElementById('adminPanel').classList.toggle('hidden');
            }
        };

        // إضافة درس
        document.getElementById('addBtn').onclick = () => {
            const title = document.getElementById('vTitle').value;
            const url = document.getElementById('vUrl').value;
            const code = document.getElementById('vCode').value;
            if(title && url && code) {
                push(ref(db, 'lessons'), { title, url, code });
                alert("تمت الإضافة!");
            }
        };

        function loadLessons() {
            onValue(ref(db, 'lessons'), (snapshot) => {
                const list = document.getElementById('lessonsList');
                list.innerHTML = '';
                snapshot.forEach(child => {
                    const lesson = child.val();
                    list.innerHTML += `
                        <div onclick="openLesson('${lesson.url}', '${lesson.code}')" class="glass p-6 rounded-[2rem] border-l-4 border-blue-600 hover:scale-105 transition cursor-pointer">
                            <div class="text-3xl mb-4 text-blue-500">🧪</div>
                            <h4 class="font-bold text-lg mb-2">${lesson.title}</h4>
                            <p class="text-gray-500 text-[10px]">علوم - المرحلة ${currentUser.level === 'prep' ? 'الإعدادية' : 'الثانوية'}</p>
                            <div class="mt-4 text-blue-400 font-bold text-sm">فتح الحصة 🔒</div>
                        </div>
                    `;
                });
            });
        }

        window.openLesson = (url, code) => {
            activeVideoUrl = url;
            activeVideoCode = code;
            document.getElementById('playerModal').classList.remove('hidden');
            document.getElementById('lockUI').classList.remove('hidden');
            document.getElementById('videoUI').classList.add('hidden');
        };

        window.confirmUnlock = () => {
            if(document.getElementById('activateInp').value === activeVideoCode) {
                document.getElementById('lockUI').classList.add('hidden');
                document.getElementById('videoUI').classList.remove('hidden');
                const vid = activeVideoUrl.split('v=')[1];
                document.getElementById('playerFrame').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${vid}?rel=0&modestbranding=1&controls=1" frameborder="0" allowfullscreen></iframe>`;
                // تفعيل العلامة المائية
                document.getElementById('wm').innerText = `${currentUser.name} - ${currentUser.phone}`;
            } else { alert("الكود غلط يا بطل!"); }
        };

        window.closePlayer = () => {
            document.getElementById('playerModal').classList.add('hidden');
            document.getElementById('playerFrame').innerHTML = '';
        };

        function loadStudentsForAdmin() {
            onValue(ref(db, 'users'), (snapshot) => {
                const div = document.getElementById('studentsList');
                div.innerHTML = '';
                snapshot.forEach(child => {
                    const user = child.val();
                    div.innerHTML += `
                        <div class="flex justify-between bg-white/5 p-2 rounded">
                            <span>${user.name} (${user.phone})</span>
                            <button onclick="blockUser('${user.phone}')" class="text-red-500 underline">${user.status === 'blocked' ? 'فك الحظر' : 'حظر'}</button>
                        </div>
                    `;
                });
            });
        }

        window.blockUser = (phone) => {
            get(child(ref(db), 'users/' + phone)).then(snap => {
                const newStatus = snap.val().status === 'blocked' ? 'active' : 'blocked';
                set(ref(db, 'users/' + phone + '/status'), newStatus);
            });
        };

        // فحص الدخول المسبق
        const saved = localStorage.getItem('tafraUser');
        if(saved) {
            currentUser = JSON.parse(saved);
            startApp();
        }
    </script>
</body>
</html>
