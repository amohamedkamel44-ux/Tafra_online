<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة أونلاين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-100">

    <nav class="bg-blue-700 text-white p-4 shadow-lg text-center font-bold text-xl">
        منصة الطفرة أونلاين - محتوى الكورس 📚
    </nav>

    <div class="max-w-md mx-auto p-4">
        <div class="bg-white p-4 rounded-xl shadow-md mb-6 border-2 border-orange-400">
            <h3 class="font-bold mb-2 text-orange-600">إضافة حصة جديدة (للميس) 🛠️</h3>
            <input id="vTitle" type="text" placeholder="عنوان الحصة" class="w-full p-2 mb-2 border rounded">
            <input id="vUrl" type="text" placeholder="لينك اليوتيوب" class="w-full p-2 mb-2 border rounded">
            <button id="addBtn" class="w-full bg-orange-500 text-white p-2 rounded font-bold">نشر الحصة الآن</button>
        </div>

        <h2 class="font-bold text-lg mb-4 text-gray-700">الحصص المتاحة 👇</h2>
        <div id="lessonsList" class="space-y-4">
            <p class="text-center text-gray-500">جاري تحميل المحاضرات...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // بياناتك من الصورة يا أحمد
        const firebaseConfig = {
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ",
            authDomain: "tafra-online.firebaseapp.com",
            databaseURL: "https://tafra-online-default-rtdb.firebaseio.com",
            projectId: "tafra-online",
            storageBucket: "tafra-online.firebaseapp.com",
            messagingSenderId: "715653554628",
            appId: "1:715653554628:web:24ce873f34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // إضافة حصة
        document.getElementById('addBtn').onclick = () => {
            const title = document.getElementById('vTitle').value;
            const url = document.getElementById('vUrl').value;
            if(title && url) {
                push(ref(db, 'lessons'), { title, url });
                alert("تمت الإضافة!");
            }
        };

        // عرض الحصص
        onValue(ref(db, 'lessons'), (snapshot) => {
            const list = document.getElementById('lessonsList');
            list.innerHTML = '';
            snapshot.forEach((child) => {
                const data = child.val();
                list.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow border-r-4 border-blue-600">
                        <h4 class="font-bold">${data.title}</h4>
                        <a href="${data.url}" target="_blank" class="text-blue-600 text-sm underline">مشاهدة الفيديو</a>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
