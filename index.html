<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة - ميس ندى كامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #050a18; color: #fff; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .gold-gradient { background: linear-gradient(135deg, #c5a059 0%, #f7dc9b 50%, #c5a059 100%); color: #050a18; }
        .input-style { background: #0f172a; border: 1px solid #1e293b; transition: 0.3s; color: white; }
        .input-style:focus { border-color: #c5a059; box-shadow: 0 0 15px rgba(197, 160, 89, 0.3); }
        .watermark { position: absolute; top: 20%; left: 30%; opacity: 0.3; pointer-events: none; color: white; font-size: 14px; z-index: 100; user-select: none; }
        .tab-btn.active { background: #c5a059; color: #050a18; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="authScreen" class="min-h-screen flex items-center justify-center p-6 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-[#1a237e33] via-[#050a18] to-[#050a18]">
    <div class="glass p-8 rounded-[2.5rem] w-full max-w-md animate-show shadow-2xl border-t-2 border-[#c5a059]/30">
        <div class="text-center mb-8">
            <h1 class="text-5xl font-900 mb-2 tracking-tighter" style="color: #c5a059;">الطفرة</h1>
            <p class="text-gray-400 text-sm">ميس ندى كامل - بوابة التميز</p>
        </div>

        <div id="loginForm" class="space-y-4">
            <input id="lPhone" type="tel" placeholder="رقم الموبايل" class="input-style w-full p-4 rounded-2xl outline-none text-right">
            <input id="lPass" type="password" placeholder="كلمة المرور" class="input-style w-full p-4 rounded-2xl outline-none text-right">
            <button onclick="doLogin()" id="loginBtn" class="gold-gradient w-full py-4 rounded-2xl font-bold text-lg hover:brightness-110 transition shadow-lg shadow-[#c5a059]/20">دخول الطالب</button>
            <p class="text-center text-sm text-gray-400">طالب جديد؟ <span onclick="toggleAuth(true)" class="text-[#c5a059] cursor-pointer font-bold underline">أنشئ حسابك</span></p>
        </div>

        <div id="regForm" class="space-y-4 hidden">
            <input id="rName" type="text" placeholder="الاسم الثلاثي" class="input-style w-full p-4 rounded-2xl outline-none text-right">
            <input id="rPhone" type="tel" placeholder="رقم موبايلك" class="input-style w-full p-4 rounded-2xl outline-none text-right">
            <input id="rParent" type="tel" placeholder="رقم ولي الأمر" class="input-style w-full p-4 rounded-2xl outline-none text-right">
            <select id="rGrade" class="input-style w-full p-4 rounded-2xl outline-none text-right">
                <option value="">اختر المرحلة الدراسية</option>
                <optgroup label="المرحلة الابتدائية"><option>رابعة ابتدائي</option><option>خامسة ابتدائي</option><option>ستة ابتدائي</option></optgroup>
                <optgroup label="المرحلة الإعدادية"><option>أولى إعدادي</option><option>ثانية إعدادي</option><option>ثالثة إعدادي</option></optgroup>
                <optgroup label="المرحلة الثانوية"><option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option></optgroup>
            </select>
            <input id="rPass" type="password" placeholder="كلمة مرور" class="input-style w-full p-4 rounded-2xl outline-none text-right">
            <button onclick="doRegister()" id="regBtn" class="gold-gradient w-full py-4 rounded-2xl font-bold text-lg">تأكيد البيانات</button>
            <p class="text-center text-sm text-gray-400" onclick="toggleAuth(false)">عندك حساب؟ <span class="text-[#c5a059] cursor-pointer font-bold underline">سجل دخول</span></p>
        </div>
    </div>
</div>

<div id="mainDashboard" class="hidden min-h-screen pb-10">
    <nav class="p-6 flex justify-between items-center border-b border-white/10 bg-[#050a18]/90 sticky top-0 z-50 backdrop-blur-md">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full gold-gradient flex items-center justify-center font-bold text-xl">👤</div>
            <div>
                <p id="uHeader" class="font-bold text-[#c5a059] leading-none"></p>
                <p class="text-[10px] text-gray-400 mt-1 uppercase tracking-widest">Student Portal</p>
            </div>
        </div>
        <button onclick="location.reload()" class="bg-red-500/10 text-red-400 text-xs px-4 py-2 rounded-lg border border-red-500/20">خروج</button>
    </nav>

    <div class="max-w-5xl mx-auto p-4">
        <div class="flex gap-2 mb-6 overflow-x-auto pb-2">
            <button onclick="showTab('lessons')" class="tab-btn active flex-1 py-3 rounded-xl border border-white/10 glass">🎥 المحاضرات</button>
            <button onclick="showTab('homework')" class="tab-btn flex-1 py-3 rounded-xl border border-white/10 glass">📝 الواجب</button>
            <button onclick="showTab('exams')" class="tab-btn flex-1 py-3 rounded-xl border border-white/10 glass">🏆 الامتحانات</button>
        </div>

        <div id="tabContent" class="space-y-6">
            <div id="lessonsTab" class="animate-show">
                <div class="glass p-6 rounded-[2rem] text-center mb-6">
                    <h3 class="text-[#c5a059] font-bold mb-4">فتح محاضرة جديدة</h3>
                    <div class="flex gap-2">
                        <input id="lCode" type="text" placeholder="ادخل كود السنتر" class="input-style flex-1 p-4 rounded-xl outline-none text-center font-bold">
                        <button onclick="unlockLesson()" class="gold-gradient px-6 rounded-xl font-bold">تفعيل</button>
                    </div>
                </div>
                
                <div id="videoBox" class="hidden">
                    <div class="relative rounded-[2rem] overflow-hidden shadow-2xl border border-white/10 bg-black aspect-video">
                        <div id="wm" class="watermark"></div>
                        <iframe id="player" width="100%" height="100%" src="" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                    </div>
                    <div class="mt-4 glass p-4 rounded-xl">
                        <h4 id="vTitle" class="font-bold text-lg text-[#c5a059]">جاري تحميل المحاضرة...</h4>
                    </div>
                </div>
            </div>

            <div id="homeworkTab" class="hidden animate-show">
                <div class="glass p-8 rounded-[2rem] text-center border-dashed border-2 border-[#c5a059]/30">
                    <p class="text-gray-400">لا يوجد واجبات مطلوبة حالياً</p>
                    <button class="mt-4 gold-gradient px-8 py-2 rounded-lg text-sm font-bold">رفع ملف الواجب</button>
                </div>
            </div>

            <div id="examsTab" class="hidden animate-show">
                <div class="glass p-6 rounded-[2rem] flex justify-between items-center border-r-4 border-yellow-500">
                    <div>
                        <h4 class="font-bold">امتحان تجريبي الشامل</h4>
                        <p class="text-xs text-gray-400">المدة: 30 دقيقة</p>
                    </div>
                    <button class="bg-yellow-500 text-black px-6 py-2 rounded-xl font-bold text-sm">ابدأ الآن</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw1dKwMk-uPJiBETA7PI8EWKVyMkNfVXVin2RB0sZTRz6yW6kf-MjXwmprTQXKEn7skCQ/exec";
    let userData = null;

    function toggleAuth(isReg) {
        document.getElementById('loginForm').classList.toggle('hidden', isReg);
        document.getElementById('regForm').classList.toggle('hidden', !isReg);
    }

    function showTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById('lessonsTab').classList.add('hidden');
        document.getElementById('homeworkTab').classList.add('hidden');
        document.getElementById('examsTab').classList.add('hidden');
        document.getElementById(tab + 'Tab').classList.remove('hidden');
    }

    async function doRegister() {
        const data = {
            name: document.getElementById('rName').value,
            phone: document.getElementById('rPhone').value,
            parent: document.getElementById('rParent').value,
            grade: document.getElementById('rGrade').value,
            pass: document.getElementById('rPass').value
        };
        if(!data.name || !data.phone || !data.pass) return alert('البيانات ناقصة!');
        
        document.getElementById('regBtn').innerText = "جاري إنشاء الحساب...";
        await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'register', data }) });
        alert('تم التسجيل! ادخل الآن');
        toggleAuth(false);
        document.getElementById('regBtn').innerText = "تأكيد البيانات";
    }

    async function doLogin() {
        const phone = document.getElementById('lPhone').value, pass = document.getElementById('lPass').value;
        document.getElementById('loginBtn').innerText = "جاري الدخول...";
        
        try {
            const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'login', data: { phone, pass } }) });
            const res = await resp.json();
            if(res.status === 'success') {
                userData = res;
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainDashboard').classList.remove('hidden');
                document.getElementById('uHeader').innerText = res.name;
                // إعداد العلامة المائية
                const wm = document.getElementById('wm');
                wm.innerText = res.name + " - " + res.phone;
                setInterval(() => {
                    wm.style.top = Math.random() * 80 + "%";
                    wm.style.left = Math.random() * 70 + "%";
                }, 5000);
            } else { alert('خطأ في البيانات!'); }
        } catch(e) { alert('مشكلة في الاتصال'); }
        document.getElementById('loginBtn').innerText = "دخول الطالب";
    }

    function unlockLesson() {
        const code = document.getElementById('lCode').value;
        if(code === "123") { // مثال لكود تفعيل
            document.getElementById('videoBox').classList.remove('hidden');
            document.getElementById('player').src = "https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0&modestbranding=1"; 
            document.getElementById('vTitle').innerText = "المحاضرة الأولى: أساسيات المادة";
        } else {
            alert('الكود غير صحيح أو مستخدم');
        }
    }
</script>
</body>
    </html>
