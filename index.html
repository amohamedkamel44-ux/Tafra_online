<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Tafra Online | منصة الطفرة التعليمية - ميس ندى كامل</title>
    <meta name="description" content="Tafra Online - المنصة الرسمية لميس ندى كامل لشرح العلوم والكيمياء. محاضرات محمية، واجبات، ومتابعة دقيقة للطلاب.">
    <meta name="keywords" content="Tafra Online, منصة الطفرة, ميس ندى كامل, علوم, كيمياء, تعليم أونلاين">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #020617; color: white; user-select: none; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .input-dark { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 12px; width: 100%; color: white; outline: none; }
        .btn-main { background: linear-gradient(135deg, #2563eb, #7c3aed); transition: 0.3s; font-weight: bold; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4); }
        .watermark { position: absolute; color: rgba(255,255,255,0.1); font-size: 14px; pointer-events: none; z-index: 1000; animation: move 15s infinite linear; }
        @keyframes move { 0% { top: 5%; left: 5%; } 50% { top: 80%; left: 70%; } 100% { top: 5%; left: 5%; } }
        .tab-content { display: none; }
        .active-tab { display: block; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="authPage" class="fixed inset-0 z-[2000] bg-[#020617] flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-lg border-blue-500/20">
            <h1 class="text-4xl font-black text-center mb-8 italic bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">TAFRA ONLINE</h1>
            
            <div class="flex p-1 bg-white/5 rounded-2xl mb-6">
                <button onclick="switchAuth('login')" id="loginTab" class="flex-1 py-2 rounded-xl font-bold bg-blue-600">دخول</button>
                <button onclick="switchAuth('signup')" id="signupTab" class="flex-1 py-2 rounded-xl font-bold">تسجيل</button>
            </div>

            <div id="loginForm" class="space-y-4">
                <input id="lPhone" type="tel" placeholder="رقم الموبايل" class="input-dark">
                <input id="lPass" type="password" placeholder="كلمة المرور" class="input-dark">
                <button onclick="doLogin()" class="w-full btn-main p-4 rounded-2xl">انطلاق 🚀</button>
            </div>

            <div id="signupForm" class="hidden space-y-3">
                <input id="rName" type="text" placeholder="الاسم الثلاثي" class="input-dark">
                <input id="rPhone" type="tel" placeholder="رقم الموبايل" class="input-dark">
                <div class="grid grid-cols-2 gap-2">
                    <select id="rStage" class="input-dark" onchange="updateYears()">
                        <option value="">المرحلة</option>
                        <option value="prep">إعدادي</option>
                        <option value="sec">ثانوي</option>
                    </select>
                    <select id="rYear" class="input-dark"><option value="">السنة</option></select>
                </div>
                <input id="rPass" type="password" placeholder="كلمة السر" class="input-dark">
                <button onclick="doSignup()" class="w-full bg-purple-600 p-4 rounded-2xl font-bold">إنشاء حساب</button>
            </div>
        </div>
    </div>

    <div id="mainContent" class="hidden min-h-screen">
        <nav class="p-4 glass flex justify-between items-center sticky top-0 z-[100]">
            <span class="font-black text-xl italic text-blue-500">TAFRA ONLINE</span>
            <div class="flex items-center gap-3">
                <span id="userName" class="text-xs font-bold text-blue-300"></span>
                <button onclick="openAdmin()" class="opacity-10">Admin</button>
                <button onclick="logout()" class="text-red-500 text-xs">خروج</button>
            </div>
        </nav>

        <div class="flex justify-center gap-4 p-4 bg-white/5">
            <button id="btn-lessons" onclick="showTab('lessons')" class="px-6 py-2 rounded-full font-bold bg-blue-600">الحصص</button>
            <button id="btn-hw" onclick="showTab('hw')" class="px-6 py-2 rounded-full font-bold bg-white/5">الواجب</button>
        </div>

        <main class="p-6 max-w-6xl mx-auto">
            <div id="adminPanel" class="hidden glass p-6 rounded-[2rem] mb-10 border-red-500/30">
                <h3 class="text-xl font-bold mb-4 text-red-500">لوحة تحكم ميس ندى</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="vTitle" type="text" placeholder="عنوان الدرس" class="input-dark">
                    <input id="vUrl" type="text" placeholder="رابط فيديو اليوتيوب" class="input-dark">
                    <select id="vYear" class="input-dark">
                        <option value="أولى إعدادي">أولى إعدادي</option><option value="تانية إعدادي">تانية إعدادي</option><option value="تالتة إعدادي">تالتة إعدادي</option>
                        <option value="أولى ثانوي">أولى ثانوي</option><option value="تانية ثانوي">تانية ثانوي</option><option value="تالتة ثانوي">تالتة ثانوي</option>
                    </select>
                    <input id="vCode" type="text" placeholder="كود التفعيل" class="input-dark">
                    <button onclick="uploadLesson()" class="md:col-span-2 btn-main p-3 rounded-xl">نشر المحتوى</button>
                </div>
                <div class="mt-6 border-t border-white/10 pt-4">
                    <h4 class="font-bold mb-2">الواجبات المسلمة:</h4>
                    <div id="adminHwList" class="space-y-2 text-xs"></div>
                </div>
            </div>

            <div id="tab-lessons" class="tab-content active-tab">
                <h2 class="text-2xl font-black mb-6" id="yearTitle">حصصك الدراسية</h2>
                <div id="lessonsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </div>

            <div id="tab-hw" class="tab-content">
                <div class="max-w-lg mx-auto glass p-8 rounded-[2rem] text-center">
                    <h2 class="text-2xl font-bold mb-4 text-green-400">تسليم الواجب الدراسي 📝</h2>
                    <input id="hwName" type="text" placeholder="اسم الدرس" class="input-dark mb-4">
                    <textarea id="hwText" placeholder="اكتب الحل هنا أو رابط الملف" class="input-dark h-32 mb-4"></textarea>
                    <button onclick="sendHw()" class="w-full bg-green-600 p-4 rounded-xl font-black">إرسال للميس ✅</button>
                </div>
            </div>
        </main>
    </div>

    <div id="playerModal" class="fixed inset-0 z-[2000] bg-black/98 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-4xl relative">
            <div id="lockZone" class="text-center p-10 glass rounded-[3rem]">
                <h3 class="text-2xl font-bold mb-6 italic">المحاضرة مشفرة 🔐</h3>
                <input id="unlockKey" type="text" placeholder="كود التفعيل" class="input-dark max-w-xs mb-6 text-center text-xl font-bold">
                <div class="flex gap-4 justify-center">
                    <button onclick="checkKey()" class="btn-main px-10 py-3 rounded-xl">تفعيل المشاهدة</button>
                    <button onclick="closeModal()" class="bg-white/10 px-10 py-3 rounded-xl">إغلاق</button>
                </div>
            </div>
            <div id="videoZone" class="hidden relative overflow-hidden rounded-[2rem]">
                <div id="watermark" class="watermark"></div>
                <div class="aspect-video bg-black" id="ytPlayer"></div>
                <button onclick="closeModal()" class="mt-4 text-gray-500 block w-full text-center">إغلاق المشغل</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ",
            authDomain: "tafra-online.firebaseapp.com",
            databaseURL: "https://tafra-online-default-rtdb.firebaseio.com",
            projectId: "tafra-online",
            storageBucket: "tafra-online.firebaseapp.com",
            messagingSenderId: "715653554628",
            appId: "1:715653554628:web:24ce873f34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let user = null; let activeCode = ""; let activeUrl = "";

        // حماية من F12 و Ctrl+U
        document.onkeydown = (e) => { if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false; };

        window.switchAuth = (t) => {
            document.getElementById('loginForm').classList.toggle('hidden', t === 'signup');
            document.getElementById('signupForm').classList.toggle('hidden', t === 'login');
            document.getElementById('loginTab').classList.toggle('bg-blue-600', t === 'login');
            document.getElementById('signupTab').classList.toggle('bg-blue-600', t === 'signup');
        };

        window.updateYears = () => {
            const s = document.getElementById('rStage').value;
            const y = document.getElementById('rYear');
            y.innerHTML = '';
            const opts = s === 'prep' ? ['أولى إعدادي','تانية إعدادي','تالتة إعدادي'] : ['أولى ثانوي','تانية ثانوي','تالتة ثانوي'];
            opts.forEach(o => y.innerHTML += `<option value="${o}">${o}</option>`);
        };

        window.doSignup = () => {
            const d = { name: document.getElementById('rName').value, phone: document.getElementById('rPhone').value, year: document.getElementById('rYear').value, pass: document.getElementById('rPass').value };
            if(!d.name || !d.phone || !d.year) return alert("أكمل البيانات!");
            set(ref(db, 'users/' + d.phone), d).then(() => { alert("تم التسجيل! سجل دخولك."); switchAuth('login'); });
        };

        window.doLogin = () => {
            const ph = document.getElementById('lPhone').value;
            const ps = document.getElementById('lPass').value;
            get(child(ref(db), 'users/' + ph)).then(s => {
                if(s.exists() && s.val().pass === ps) {
                    localStorage.setItem('tafra_user', JSON.stringify(s.val()));
                    location.reload();
                } else alert("بيانات خطأ!");
            });
        };

        const saved = localStorage.getItem('tafra_user');
        if(saved) {
            user = JSON.parse(saved);
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('userName').innerText = user.name;
            document.getElementById('yearTitle').innerText = "حصص " + user.year;
            loadLessons();
            loadAdminHw();
        }

        window.showTab = (t) => {
            document.getElementById('tab-lessons').classList.toggle('active-tab', t === 'lessons');
            document.getElementById('tab-hw').classList.toggle('active-tab', t === 'hw');
            document.getElementById('btn-lessons').classList.toggle('bg-blue-600', t === 'lessons');
            document.getElementById('btn-hw').classList.toggle('bg-blue-600', t === 'hw');
        };

        function loadLessons() {
            onValue(ref(db, 'lessons'), s => {
                const grid = document.getElementById('lessonsGrid'); grid.innerHTML = '';
                s.forEach(c => {
                    const l = c.val();
                    if(l.year === user.year) grid.innerHTML += `
                        <div onclick="openPlay('${l.url}','${l.code}')" class="glass p-6 rounded-[2rem] border-b-4 border-blue-500 cursor-pointer hover:bg-white/5 transition">
                            <h4 class="font-bold text-lg mb-2">${l.title}</h4>
                            <p class="text-xs text-gray-500 italic">${l.year} - علوم</p>
                            <div class="mt-4 text-blue-400 font-bold">شاهد الحصة 🔐</div>
                        </div>`;
                });
            });
        }

        window.openPlay = (u, c) => { activeUrl = u; activeCode = c; document.getElementById('playerModal').classList.remove('hidden'); document.getElementById('lockZone').classList.remove('hidden'); document.getElementById('videoZone').classList.add('hidden'); };

        window.checkKey = () => {
            if(document.getElementById('unlockKey').value === activeCode) {
                document.getElementById('lockZone').classList.add('hidden');
                document.getElementById('videoZone').classList.remove('hidden');
                const id = activeUrl.split('v=')[1]?.split('&')[0];
                document.getElementById('ytPlayer').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?rel=0" frameborder="0" allowfullscreen></iframe>`;
                document.getElementById('watermark').innerText = user.name + " - " + user.phone;
            } else alert("كود خطأ!");
        };

        window.uploadLesson = () => {
            push(ref(db, 'lessons'), { title: document.getElementById('vTitle').value, url: document.getElementById('vUrl').value, year: document.getElementById('vYear').value, code: document.getElementById('vCode').value }).then(() => alert("تم النشر!"));
        };

        window.sendHw = () => {
            push(ref(db, 'homeworks'), { student: user.name, lesson: document.getElementById('hwName').value, content: document.getElementById('hwText').value }).then(() => alert("تم التسليم ✅"));
        };

        window.openAdmin = () => { if(prompt("كلمة سر الإدارة:") === "Rtslanme 44") document.getElementById('adminPanel').classList.toggle('hidden'); };
        window.logout = () => { localStorage.clear(); location.reload(); };
        window.closeModal = () => { document.getElementById('playerModal').classList.add('hidden'); document.getElementById('ytPlayer').innerHTML = ''; };

        function loadAdminHw() {
            onValue(ref(db, 'homeworks'), s => {
                const list = document.getElementById('adminHwList'); list.innerHTML = '';
                s.forEach(c => { const h = c.val(); list.innerHTML += `<div class="bg-white/5 p-2 rounded">طالب: ${h.student} | درس: ${h.lesson} | الحل: ${h.content}</div>`; });
            });
        }
    </script>
</body>
</html>
