<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>الطفرة أونلاين</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>

    body{
      font-family:'Cairo',sans-serif;
      background:#f3f4f6;
    }

    .bg-main{
      background:
      linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),
      url('https://images.unsplash.com/photo-1509062522246-3755977927d7');
      background-size:cover;
      background-position:center;
    }

    .glass{
      background:rgba(255,255,255,.95);
      backdrop-filter:blur(10px);
    }

    .input{
      width:100%;
      padding:14px;
      border-radius:18px;
      border:1px solid #ddd;
      margin-bottom:12px;
      outline:none;
      background:#f8fafc;
    }

    .btn{
      width:100%;
      padding:14px;
      border-radius:18px;
      font-weight:bold;
      transition:.3s;
    }

    .btn:hover{
      transform:scale(1.02);
    }

  </style>

</head>

<body>

<div class="min-h-screen flex items-center justify-center p-5 bg-main">

  <div class="glass w-full max-w-md rounded-[35px] overflow-hidden shadow-2xl">

    <div class="bg-cyan-600 text-white p-8 text-center">

      <div class="w-24 h-24 bg-white rounded-3xl mx-auto mb-4 flex items-center justify-center text-5xl shadow-xl">
        🔬
      </div>

      <h1 class="text-4xl font-black mb-2">
        الطفرة أونلاين
      </h1>

      <p class="opacity-90">
        منصة ميس ندى كامل التعليمية
      </p>

    </div>

    <div class="p-7">

      <div class="flex bg-slate-100 rounded-2xl p-1 mb-6">

        <button id="loginTab"
        class="flex-1 py-3 rounded-2xl bg-cyan-600 text-white font-bold">
          تسجيل الدخول
        </button>

        <button id="registerTab"
        class="flex-1 py-3 rounded-2xl text-slate-500 font-bold">
          إنشاء حساب
        </button>

      </div>

      <!-- LOGIN -->

      <div id="loginBox">

        <input
        type="email"
        id="loginEmail"
        placeholder="البريد الإلكتروني"
        class="input">

        <input
        type="password"
        id="loginPassword"
        placeholder="كلمة المرور"
        class="input">

        <button
        onclick="login()"
        class="btn bg-cyan-600 text-white">
          دخول للمنصة
        </button>

        <button
        onclick="openAdmin()"
        class="mt-4 w-full text-sm text-slate-400">
          دخول الإدارة
        </button>

      </div>

      <!-- REGISTER -->

      <div id="registerBox" class="hidden">

        <input
        type="text"
        id="registerName"
        placeholder="اسم الطالب"
        class="input">

        <input
        type="email"
        id="registerEmail"
        placeholder="البريد الإلكتروني"
        class="input">

        <input
        type="password"
        id="registerPassword"
        placeholder="كلمة المرور"
        class="input">

        <select
        id="registerYear"
        class="input">

          <option value="">
            اختر السنة الدراسية
          </option>

          <option>
            أولى ثانوي
          </option>

          <option>
            ثانية ثانوي
          </option>

          <option>
            ثالثة ثانوي
          </option>

        </select>

        <button
        onclick="register()"
        class="btn bg-green-600 text-white">
          إنشاء الحساب
        </button>

      </div>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {

getDatabase,
ref,
set,
get,
child

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {

apiKey: "حط API KEY",

authDomain: "حط AUTH DOMAIN",

databaseURL: "حط DATABASE URL",

projectId: "حط PROJECT ID",

storageBucket: "حط STORAGE BUCKET",

messagingSenderId: "حط SENDER ID",

appId: "حط APP ID"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


// SWITCH

const loginTab =
document.getElementById("loginTab");

const registerTab =
document.getElementById("registerTab");

const loginBox =
document.getElementById("loginBox");

const registerBox =
document.getElementById("registerBox");

loginTab.addEventListener("click",()=>{

loginBox.classList.remove("hidden");

registerBox.classList.add("hidden");

loginTab.classList.add(
"bg-cyan-600",
"text-white"
);

registerTab.classList.remove(
"bg-green-600",
"text-white"
);

});

registerTab.addEventListener("click",()=>{

registerBox.classList.remove("hidden");

loginBox.classList.add("hidden");

registerTab.classList.add(
"bg-green-600",
"text-white"
);

loginTab.classList.remove(
"bg-cyan-600",
"text-white"
);

});


// REGISTER

window.register = async()=>{

const name =
document.getElementById("registerName").value;

const email =
document.getElementById("registerEmail").value;

const password =
document.getElementById("registerPassword").value;

const year =
document.getElementById("registerYear").value;

if(!name || !email || !password || !year){

alert("اكمل البيانات");

return;

}

try{

const userCredential =

await createUserWithEmailAndPassword(
auth,
email,
password
);

const user = userCredential.user;

await set(ref(db,"users/"+user.uid),{

name:name,

email:email,

year:year,

isPaid:false,

blocked:false,

role:"student",

createdAt:Date.now()

});

alert("تم إنشاء الحساب ✅");

}

catch(error){

alert(error.message);

}

};


// LOGIN

window.login = async()=>{

const email =
document.getElementById("loginEmail").value;

const password =
document.getElementById("loginPassword").value;

try{

const userCredential =

await signInWithEmailAndPassword(
auth,
email,
password
);

const user = userCredential.user;

const snapshot =

await get(child(ref(db),"users/"+user.uid));

const data = snapshot.val();

if(data.blocked){

alert("تم حظر حسابك");

return;

}

localStorage.setItem(
"tafraUser",
JSON.stringify({
uid:user.uid,
...data
})
);

if(data.role === "admin"){

window.location.href =
"admin.html";

}

else{

window.location.href =
"student.html";

}

}

catch(error){

alert("بيانات غير صحيحة");

}

};


// ADMIN

window.openAdmin = ()=>{

const password = prompt("كلمة سر الإدارة");

if(password === "tafra2026"){

localStorage.setItem(
"adminAccess",
"true"
);

window.location.href =
"admin.html";

}

};

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8"/>

<meta name="viewport"
content="width=device-width,initial-scale=1.0"/>

<title>
الطفرة أونلاين
</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

<style>

body{
font-family:'Cairo',sans-serif;
background:#f1f5f9;
}

.card{
background:white;
border-radius:24px;
padding:18px;
box-shadow:0 5px 20px rgba(0,0,0,.05);
margin-bottom:18px;
}

.btn{
padding:12px 18px;
border-radius:14px;
font-weight:bold;
}

</style>

</head>

<body>

<nav class="bg-white p-4 shadow-sm flex justify-between items-center sticky top-0 z-50">

<div>

<h1 class="font-black text-cyan-600 text-2xl">
الطفرة أونلاين
</h1>

<p id="studentName"
class="text-slate-400 text-sm">
...
</p>

</div>

<div class="flex gap-2">

<button
onclick="showRecharge()"
class="btn bg-yellow-400">
💳 شحن
</button>

<button
onclick="logout()"
class="btn bg-red-500 text-white">
خروج
</button>

</div>

</nav>

<div class="max-w-3xl mx-auto p-5">

<div class="bg-gradient-to-r from-cyan-500 to-blue-500 rounded-[30px] text-white p-8 mb-6 shadow-xl">

<h2 class="text-3xl font-black mb-2">

أهلاً بك 👋

</h2>

<p>

تابع محاضراتك وامتحاناتك بسهولة

</p>

</div>

<div id="lessonsContainer">

</div>

</div>

<!-- VIDEO -->

<div id="videoModal"
class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-5">

<div class="w-full max-w-5xl relative">

<button
onclick="closeVideo()"
class="absolute -top-12 left-0 text-white bg-red-500 px-4 py-2 rounded-xl">

إغلاق ✕

</button>

<div id="videoPlayer"
class="aspect-video rounded-2xl overflow-hidden">
</div>

</div>

</div>

<!-- RECHARGE -->

<div id="rechargeModal"
class="hidden fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-5">

<div class="bg-white rounded-[30px] p-8 w-full max-w-md">

<h2 class="text-2xl font-black mb-4">
شحن كود 🎫
</h2>

<input
id="codeInput"
placeholder="اكتب الكود"
class="w-full p-4 rounded-2xl border mb-4 outline-none">

<button
onclick="recharge()"
class="btn bg-cyan-600 text-white w-full">

تفعيل الكود

</button>

</div>

</div>

<script type="module">

import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {

getDatabase,
ref,
onValue,
push,
get,
child,
remove,
update

}

from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {

apiKey:"حط API KEY",

authDomain:"حط AUTH DOMAIN",

databaseURL:"حط DATABASE URL",

projectId:"حط PROJECT ID",

storageBucket:"حط STORAGE",

messagingSenderId:"حط SENDER ID",

appId:"حط APP ID"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

const user =
JSON.parse(localStorage.getItem("tafraUser"));

if(!user){

location.href = "index.html";

}

document.getElementById(
"studentName"
).innerText =
user.name + " - " + user.year;


// CHECK BLOCK

get(child(ref(db),"users/"+user.uid))

.then(snapshot=>{

const data = snapshot.val();

if(data.blocked){

alert("تم حظر حسابك");

localStorage.clear();

location.href = "index.html";

}

});


// LOAD LESSONS

onValue(ref(db,"lessons"),snapshot=>{

const container =
document.getElementById("lessonsContainer");

container.innerHTML = "";

snapshot.forEach(childSnap=>{

const lesson = childSnap.val();

if(lesson.year === user.year){

container.innerHTML += `

<div class="card">

<div class="flex justify-between items-center mb-4">

<div>

<h2 class="font-black text-xl">

${lesson.title}

</h2>

<p class="text-slate-400 text-sm">

${lesson.year}

</p>

</div>

<span class="bg-cyan-100 text-cyan-600 px-3 py-1 rounded-full text-sm">

محاضرة

</span>

</div>

<div class="flex gap-3 flex-wrap">

<button
onclick="openVideo('${lesson.url}')"
class="btn bg-cyan-600 text-white">

📺 مشاهدة

</button>

<button
onclick="sendHomework('${lesson.title}')"
class="btn bg-yellow-400">

📝 الواجب

</button>

</div>

</div>

`;

}

});

});


// VIDEO

window.openVideo = (url)=>{

if(!user.isPaid){

alert("يجب شحن كود أولاً");

return;

}

const id =
url.split("v=")[1]?.split("&")[0];

document.getElementById(
"videoModal"
).classList.remove("hidden");

document.getElementById(
"videoPlayer"
).innerHTML = `

<iframe
width="100%"
height="100%"
src="https://www.youtube.com/embed/${id}?autoplay=1"
frameborder="0"
allowfullscreen>
</iframe>

`;

};

window.closeVideo = ()=>{

document.getElementById(
"videoModal"
).classList.add("hidden");

document.getElementById(
"videoPlayer"
).innerHTML = "";

};


// HOMEWORK

window.sendHomework = (lesson)=>{

const answer =
prompt("اكتب الواجب أو اللينك");

if(!answer) return;

push(ref(db,"homeworks"),{

student:user.name,

lesson:lesson,

answer:answer,

uid:user.uid,

createdAt:Date.now()

})

.then(()=>{

alert("تم إرسال الواجب ✅");

});

};


// RECHARGE

window.showRecharge = ()=>{

document.getElementById(
"rechargeModal"
).classList.remove("hidden");

};

window.recharge = ()=>{

const code =
document.getElementById("codeInput").value;

get(child(ref(db),"codes/"+code))

.then(snapshot=>{

if(snapshot.exists()){

update(ref(db,"users/"+user.uid),{

isPaid:true

});

remove(ref(db,"codes/"+code));

alert("تم التفعيل ✅");

location.reload();

}

else{

alert("كود غير صحيح");

}

});

};


// LOGOUT

window.logout = ()=>{

localStorage.clear();

location.href = "index.html";

};

</script>

</body>
</html>
