<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>الطفرة أونلاين</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: #f3f4f6;
    }

    .glass {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
    }

    .main-bg {
      background:
        linear-gradient(rgba(0, 0, 0, .5),
            rgba(0, 0, 0, .5)),
        url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f');
      background-size: cover;
      background-position: center;
    }

    .input {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid #ddd;
      outline: none;
      background: #f9fafb;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 18px;
      font-weight: bold;
      transition: .3s;
    }

    .btn:hover {
      transform: scale(1.02);
    }
  </style>
</head>

<body>

  <div class="min-h-screen flex items-center justify-center p-5 main-bg">

    <div class="glass w-full max-w-md rounded-[35px] shadow-2xl overflow-hidden">

      <div class="bg-blue-600 p-8 text-center text-white">

        <div class="w-24 h-24 rounded-3xl bg-white mx-auto mb-4 flex items-center justify-center text-5xl shadow-xl">
          🎓
        </div>

        <h1 class="text-4xl font-black mb-2">
          الطفرة أونلاين
        </h1>

        <p class="opacity-90">
          منصة تعليمية احترافية
        </p>

      </div>

      <div class="p-7">

        <div class="flex mb-6 bg-slate-100 rounded-2xl p-1">

          <button id="loginTab"
            class="flex-1 py-3 rounded-2xl bg-blue-600 text-white font-bold">
            تسجيل الدخول
          </button>

          <button id="registerTab"
            class="flex-1 py-3 rounded-2xl font-bold text-slate-500">
            إنشاء حساب
          </button>

        </div>

        <!-- LOGIN -->

        <div id="loginBox">

          <input type="email"
            id="loginEmail"
            placeholder="البريد الإلكتروني"
            class="input">

          <input type="password"
            id="loginPassword"
            placeholder="كلمة المرور"
            class="input">

          <button onclick="login()"
            class="btn bg-blue-600 text-white">
            دخول للمنصة
          </button>

        </div>

        <!-- REGISTER -->

        <div id="registerBox" class="hidden">

          <input type="text"
            id="registerName"
            placeholder="اسم الطالب"
            class="input">

          <input type="email"
            id="registerEmail"
            placeholder="البريد الإلكتروني"
            class="input">

          <input type="password"
            id="registerPassword"
            placeholder="كلمة المرور"
            class="input">

          <select id="registerYear"
            class="input">

            <option value="">اختر السنة الدراسية</option>

            <option>أولى ثانوي</option>
            <option>ثانية ثانوي</option>
            <option>ثالثة ثانوي</option>

          </select>

          <button onclick="register()"
            class="btn bg-green-600 text-white">
            إنشاء الحساب
          </button>

        </div>

      </div>

    </div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    import {
      getDatabase,
      ref,
      set
    }
      from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {

      apiKey: "حط API KEY",

      authDomain: "حط AUTH DOMAIN",

      databaseURL: "حط DATABASE URL",

      projectId: "حط PROJECT ID",

      storageBucket: "حط STORAGE",

      messagingSenderId: "حط ID",

      appId: "حط APP ID"

    };

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getDatabase(app);

    // SWITCH

    const loginTab =
      document.getElementById("loginTab");

    const registerTab =
      document.getElementById("registerTab");

    const loginBox =
      document.getElementById("loginBox");

    const registerBox =
      document.getElementById("registerBox");

    loginTab.onclick = () => {

      loginBox.classList.remove("hidden");

      registerBox.classList.add("hidden");

      loginTab.classList.add("bg-blue-600", "text-white");

      registerTab.classList.remove("bg-green-600", "text-white");

    };

    registerTab.onclick = () => {

      registerBox.classList.remove("hidden");

      loginBox.classList.add("hidden");

      registerTab.classList.add("bg-green-600", "text-white");

    };

    // REGISTER

    window.register = async () => {

      const name =
        document.getElementById("registerName").value;

      const email =
        document.getElementById("registerEmail").value;

      const password =
        document.getElementById("registerPassword").value;

      const year =
        document.getElementById("registerYear").value;

      if (!name || !email || !password || !year) {

        alert("اكمل البيانات");

        return;
      }

      try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );

        const user = userCredential.user;

        await set(ref(db, "users/" + user.uid), {

          name: name,

          email: email,

          year: year,

          isPaid: false,

          createdAt: Date.now()

        });

        alert("تم إنشاء الحساب بنجاح ✅");

      }

      catch (error) {

        alert(error.message);

      }

    };

    // LOGIN

    window.login = async () => {

      const email =
        document.getElementById("loginEmail").value;

      const password =
        document.getElementById("loginPassword").value;

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        alert("تم تسجيل الدخول ✅");

        window.location.href = "student.html";

      }

      catch (error) {

        alert("بيانات غير صحيحة");

      }

    };

  </script>

</body>

</html>
