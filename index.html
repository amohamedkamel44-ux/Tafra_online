<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة أونلاين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; }
        .video-container { position: relative; overflow: hidden; border-radius: 1rem; background: #000; }
        .watermark { 
            position: absolute; color: rgba(255,255,255,0.3); 
            font-size: 12px; pointer-events: none; user-select: none;
            animation: move 10s linear infinite;
        }
        @keyframes move {
            0% { top: 10%; left: 10%; }
            50% { top: 80%; left: 70%; }
            100% { top: 10%; left: 10%; }
        }
    </style>
</head>
<body>
    <nav class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 text-white p-2 rounded-lg font-bold">الطفرة</div>
            <span class="font-bold text-gray-700 text-lg">أونلاين</span>
        </div>
        <div class="flex gap-4 items-center">
            <span id="userName" class="text-sm font-bold text-blue-600">جاري التحميل...</span>
            <button class="bg-gray-100 p-2 rounded-full">🔔</button>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4">
        <div class="mb-6">
            <h2 class="text-2xl font-bold text-gray-800 mb-4">محتوى الكورس 📚</h2>
            <div id="lessonsList" class="grid gap-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border-r-4 border-blue-500 animate-pulse">
                    جاري تحميل المحاضرات...
                </div>
            </div>
        </div>
    </main>

    <div id="videoModal" class="fixed inset-0 bg-black bg-opacity-90 hidden z-[100] p-4">
        <button onclick="closeVideo()" class="absolute top-4 right-4 text-white text-3xl">&times;</button>
        <div class="max-w-4xl mx-auto mt-10">
            <div class="video-container shadow-2xl">
                <div id="player"></div>
                <div id="watermark" class="watermark"></div>
            </div>
            <h3 id="playingTitle" class="text-white text-xl mt-4 font-bold"></h3>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // مفاتيح الربط الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ",
            authDomain: "tafra-online.firebaseapp.com",
            projectId: "tafra-online",
            storageBucket: "tafra-online.firebaseapp.com",
            messagingSenderId: "715653554628",
            appId: "1:715653554628:web:24ce873f34",
            measurementId: "G-Q5BSZTHYHN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // تحميل المحاضرات
        async function loadLessons() {
            const querySnapshot = await getDocs(collection(db, "lessons"));
            const container = document.getElementById('lessonsList');
            container.innerHTML = '';
            
            querySnapshot.forEach((doc) => {
                const lesson = doc.data();
                container.innerHTML += `
                    <div class="bg-white p-4 rounded-2xl shadow-sm border-r-4 border-blue-500 flex justify-between items-center hover:bg-blue-50 transition cursor-pointer" onclick="openVideo('${lesson.url}', '${lesson.title}')">
                        <div>
                            <h3 class="font-bold text-lg">${lesson.title}</h3>
                            <p class="text-gray-500 text-sm">${lesson.description || 'شرح الدرس بالكامل'}</p>
                        </div>
                        <span class="bg-blue-100 text-blue-600 px-4 py-2 rounded-xl font-bold">دخول</span>
                    </div>
                `;
            });
        }

        window.openVideo = (url, title) => {
            const videoId = url.split('v=')[1];
            document.getElementById('videoModal').classList.remove('hidden');
            document.getElementById('playingTitle').innerText = title;
            document.getElementById('player').innerHTML = `<iframe width="100%" height="400" src="https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1" frameborder="0" allowfullscreen></iframe>`;
            // تفعيل العلامة المائية
            document.getElementById('watermark').innerText = "منصة الطفرة - الطالب: " + (localStorage.getItem('studentName') || 'أحمد كمال');
        }

        window.closeVideo = () => {
            document.getElementById('videoModal').classList.add('hidden');
            document.getElementById('player').innerHTML = '';
        }

        loadLessons();
        document.getElementById('userName').innerText = "مرحباً يا بطل 💡";
    </script>
</body>
</html>
