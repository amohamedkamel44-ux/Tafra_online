<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tafra Online | Protected</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #020617; color: white; user-select: none; } /* منع النسخ */
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .input-dark { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 12px; width: 100%; color: white; outline: none; }
        .btn-main { background: linear-gradient(135deg, #2563eb, #7c3aed); transition: 0.3s; }
        .watermark { position: absolute; color: rgba(255,255,255,0.1); font-size: 12px; pointer-events: none; z-index: 100; animation: move 12s infinite linear; }
        @keyframes move { 0% { top: 5%; left: 5%; } 50% { top: 85%; left: 75%; } 100% { top: 5%; left: 5%; } }
        .hidden { display: none; }
        .active-tab { background: #2563eb !important; }
    </style>
</head>
<body oncontextmenu="return false;"> <div id="authPage" class="fixed inset-0 z-[1000] bg-[#020617] flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-lg border-blue-500/20">
            <h1 class="text-4xl font-black text-center mb-8 italic bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">TAFRA ONLINE</h1>
            
            <div class="flex p-1 bg-white/5 rounded-2xl mb-6">
                <button onclick="switchAuth('login')" id="loginTab" class="flex-1 py-2 rounded-xl font-bold bg-blue-600">دخول</button>
                <button onclick="switchAuth('signup')" id="signupTab" class="flex-1 py-2 rounded-xl font-bold">تسجيل</button>
            </div>

            <div id="loginForm" class="space-y-4">
                <input id="lPhone" type="tel" placeholder="رقم الموبايل" class="input-dark">
                <input id="lPass" type="password" placeholder="كلمة المرور" class="input-dark">
                <button onclick="doLogin()" class="w-full btn-main p-4 rounded-2xl font-black">تسجيل الدخول</button>
            </div>

            <div id="signupForm" class="hidden space-y-3">
                <input id="rName" type="text" placeholder="الاسم الثلاثي" class="input-dark">
                <input id="rPhone" type="tel" placeholder="رقم الموبايل" class="input-dark">
                <div class="grid grid-cols-2 gap-2">
                    <select id="rStage" class="input-dark" onchange="updateYears()"><option value="">المرحلة</option><option value="prep">إعدادي</option><option value="sec">ثانوي</option></select>
                    <select id="rYear" class="input-dark"><option value="">السنة</option></select>
                </div>
                <input id="rSchool" type="text" placeholder="المدرسة" class="input-dark">
                <input id="rPass" type="password" placeholder="كلمة سر قوية" class="input-dark">
                <button onclick="doSignup()" class="w-full bg-purple-600 p-4 rounded-2xl font-black">إنشاء حساب</button>
            </div>
        </div>
    </div>

    <div id="mainContent" class="hidden min-h-screen">
        <nav class="p-4 glass flex justify-between items-center sticky top-0 z-50">
            <span class="font-black text-xl italic text-blue-500">TAFRA ONLINE</span>
            <div class="flex items-center gap-3 italic">
                <span id="userName" class="text-[10px] text-blue-300"></span>
                <button onclick="openAdmin()" class="opacity-10">Admin</button>
                <button onclick="logout()" class="text-red-500 text-xs">خروج</button>
            </div>
        </nav>

        <div class="flex justify-center gap-2 p-4 bg-white/5 shadow-inner">
            <button id="btn-lessons" onclick="showTab('lessons')" class="px-6 py-2 rounded-xl font-bold text-sm bg-white/5 active-tab">المحاضرات</button>
            <button id="btn-hw" onclick="showTab('hw')" class="px-6 py-2 rounded-xl font-bold text-sm bg-white/5">تسليم الواجب</button>
        </div>

        <main class="p-6 max-w-6xl mx-auto">
            <div id="adminPanel" class="hidden glass p-6 rounded-[2rem] mb-10 border-red-900/50">
                <h3 class="text-xl font-bold mb-4 text-red-500">إدارة المنصة (المستوى المحمي)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="vTitle" type="text" placeholder="عنوان الدرس" class="input-dark">
                    <input id="vUrl" type="text" placeholder="رابط فيديو" class="input-dark">
                    <select id="vYear" class="input-dark">
                        <option value="أولى ثانوي">أولى ثانوي</option><option value="تانية ثانوي">تانية ثانوي</option><option value="تالتة ثانوي">تالتة ثانوي</option>
                        <option value="أولى إعدادي">أولى إعدادي</option><option value="تانية إعدادي">تانية إعدادي</option><option value="تالتة إعدادي">تالتة إعدادي</option>
                    </select>
                    <input id="vCode" type="text" placeholder="كود تفعيل الحصة" class="input-dark">
                    <button onclick="uploadLesson()" class="md:col-span-2 btn-main p-3 rounded-xl font-bold">نشر المحتوى</button>
                </div>
            </div>

            <div id="tab-lessons" class="tab-content grid grid-cols-1 md:grid-cols-3 gap-6 italic"></div>
            
            <div id="tab-hw" class="tab-content hidden max-w-lg mx-auto">
                <div class="glass p-8 rounded-[2rem] text-center">
                    <h3 class="text-xl font-bold mb-4">رفع الواجب الدراسي</h3>
                    <input id="hwName" type="text" placeholder="اسم الدرس" class="input-dark mb-4">
                    <textarea id="hwText" placeholder="اكتب الحل هنا أو لينك الملف" class="input-dark h-32 mb-4"></textarea>
                    <button onclick="sendHw()" class="w-full bg-green-600 p-4 rounded-xl font-black">إرسال للمراجعة ✅</button>
                </div>
            </div>
        </main>
    </div>

    <div id="playerModal" class="fixed inset-0 z-[2000] bg-black/98 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-4xl relative">
            <div id="lockZone" class="text-center p-10 glass rounded-[3rem]">
                <h3 class="text-2xl font-bold mb-6 italic underline">المحاضرة محمية 🔐</h3>
                <input id="unlockKey" type="text" placeholder="أدخل كود التفعيل" class="input-dark max-w-xs mb-6 text-center text-xl">
                <div class="flex gap-4 justify-center">
                    <button onclick="checkKey()" class="btn-main px-10 py-3 rounded-xl font-bold italic">تفعيل</button>
                    <button onclick="closeModal()" class="bg-white/10 px-10 py-3 rounded-xl">إغلاق</button>
                </div>
            </div>
            <div id="videoZone" class="hidden relative overflow-hidden rounded-[2rem]">
                <div id="watermark" class="watermark"></div>
                <div class="aspect-video bg-black" id="ytPlayer"></div>
                <button onclick="closeModal()" class="mt-4 text-gray-500 block w-full text-center">رجوع للمنصة</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ",
            authDomain: "tafra-online.firebaseapp.com",
            databaseURL: "https://tafra-online-default-rtdb.firebaseio.com",
            projectId: "tafra-online",
            storageBucket: "tafra-online.firebaseapp.com",
            messagingSenderId: "715653554628",
            appId: "1:715653554628:web:24ce873f34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let user = null; let activeCode = ""; let activeUrl = "";

        // الحماية من الاختصارات F12 و Ctrl+U
        document.onkeydown = (e) => {
            if (e.keyCode == 123 || (e.ctrlKey && (e.keyCode == 85 || e.keyCode == 73 || e.keyCode == 74))) return false;
        };

        window.switchAuth = (t) => {
            document.getElementById('loginForm').classList.toggle('hidden', t === 'signup');
            document.getElementById('signupForm').classList.toggle('hidden', t === 'login');
            document.getElementById('loginTab').classList.toggle('bg-blue-600', t === 'login');
            document.getElementById('signupTab').classList.toggle('bg-blue-600', t === 'signup');
        };

        window.updateYears = () => {
            const s = document.getElementById('rStage').value;
            const y = document.getElementById('rYear');
            y.innerHTML = '';
            const opts = s === 'prep' ? ['أولى إعدادي','تانية إعدادي','تالتة إعدادي'] : ['أولى ثانوي','تانية ثانوي','تالتة ثانوي'];
            opts.forEach(o => y.innerHTML += `<option value="${o}">${o}</option>`);
        };

        window.doSignup = () => {
            const d = { name: document.getElementById('rName').value, phone: document.getElementById('rPhone').value, year: document.getElementById('rYear').value, pass: document.getElementById('rPass').value, status: 'active' };
            if(!d.name || !d.phone) return alert("املا البيانات!");
            set(ref(db, 'users/' + d.phone), d).then(() => { alert("تم! ادخل الآن."); switchAuth('login'); });
        };

        window.doLogin = () => {
            const ph = document.getElementById('lPhone').value;
            const ps = document.getElementById('lPass').value;
            get(child(ref(db), 'users/' + ph)).then(s => {
                if(s.exists() && s.val().pass === ps) {
                    localStorage.setItem('tafra_secure_user', JSON.stringify(s.val()));
                    location.reload();
                } else alert("خطأ!");
            });
        };

        const saved = localStorage.getItem('tafra_secure_user');
        if(saved) {
            user = JSON.parse(saved);
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('userName').innerText = user.name;
            loadData();
        }

        function loadData() {
            onValue(ref(db, 'lessons'), s => {
                const g = document.getElementById('tab-lessons'); g.innerHTML = '';
                s.forEach(c => {
                    const l = c.val();
                    if(l.year === user.year) g.innerHTML += `<div onclick="openPlay('${l.url}','${l.code}')" class="glass p-6 rounded-[2rem] border-r-4 border-blue-500 cursor-pointer hover:bg-white/5 transition">
                        <h4 class="font-bold underline mb-2">${l.title}</h4>
                        <p class="text-[10px] text-gray-500">مادة العلوم | ${l.year}</p>
                    </div>`;
                });
            });
        }

        window.showTab = (t) => {
            document.getElementById('tab-lessons').classList.toggle('hidden', t === 'hw');
            document.getElementById('tab-hw').classList.toggle('hidden', t === 'lessons');
            document.getElementById('btn-lessons').classList.toggle('active-tab', t === 'lessons');
            document.getElementById('btn-hw').classList.toggle('active-tab', t === 'hw');
        };

        window.openPlay = (u, c) => { activeUrl = u; activeCode = c; document.getElementById('playerModal').classList.remove('hidden'); document.getElementById('lockZone').classList.remove('hidden'); document.getElementById('videoZone').classList.add('hidden'); };

        window.checkKey = () => {
            if(document.getElementById('unlockKey').value === activeCode) {
                document.getElementById('lockZone').classList.add('hidden');
                document.getElementById('videoZone').classList.remove('hidden');
                const id = activeUrl.split('v=')[1];
                document.getElementById('ytPlayer').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?rel=0&modestbranding=1" frameborder="0" allowfullscreen></iframe>`;
                document.getElementById('watermark').innerText = `${user.name} - ${user.phone}`;
            } else alert("الكود خطأ!");
        };

        window.uploadLesson = () => {
            push(ref(db, 'lessons'), { title: document.getElementById('vTitle').value, url: document.getElementById('vUrl').value, year: document.getElementById('vYear').value, code: document.getElementById('vCode').value }).then(() => alert("نُشر!"));
        };

        window.sendHw = () => {
            push(ref(db, 'homeworks'), { student: user.name, lesson: document.getElementById('hwName').value, content: document.getElementById('hwText').value }).then(() => alert("وصل يا بطل!"));
        };

        window.openAdmin = () => { if(prompt("أدخل كلمة السر الجديدة:") === "Rtslanme 44") document.getElementById('adminPanel').classList.toggle('hidden'); };
        window.logout = () => { localStorage.clear(); location.reload(); };
        window.closeModal = () => { document.getElementById('playerModal').classList.add('hidden'); document.getElementById('ytPlayer').innerHTML = ''; };
    </script>
</body>
                        </html>
