<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة أونلاين | ميس ندى كامل</title>
    
    <meta name="description" content="انضم لأقوى منصة تعليمية في العلوم مع ميس ندى كامل. شرح مبسط، امتحانات تفاعلية، ومتابعة دورية.">
    <meta name="keywords" content="منصة الطفرة، ميس ندى كامل، علوم ثانوي، فيزياء، سنتر، دروس اونلاين">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root { --main: #00bcd4; --dark: #00838f; --rose: #ff4081; --bg: #f4f7f6; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); color: #2d3436; }

        /* تجميل البطاقات زي المنصات الكبرى */
        .lecture-card { background: white; border-radius: 25px; border: 1px solid #eef2f3; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .lecture-card:hover { transform: translateY(-10px); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); border-color: var(--main); }
        
        /* العلامة المائية للحماية */
        #watermark { position: fixed; top: 20%; left: 10%; color: rgba(0,0,0,0.05); font-size: 2vw; pointer-events: none; z-index: 9999; transform: rotate(-30deg); display: none; }

        /* شريط الأخبار العاجلة */
        .news-ticker { background: white; border-bottom: 1px solid #eee; overflow: hidden; white-space: nowrap; padding: 10px 0; }
        .news-content { display: inline-block; animation: ticker 20s linear infinite; font-weight: bold; color: var(--dark); }
        @keyframes ticker { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .btn-premium { background: linear-gradient(135deg, var(--main), var(--dark)); color: white; border-radius: 18px; font-weight: 900; transition: 0.3s; box-shadow: 0 8px 15px rgba(0, 188, 212, 0.2); }
        .btn-premium:hover { filter: brightness(1.1); transform: scale(1.02); }

        .sidebar-overlay { background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="watermark"></div>

    <div class="news-ticker">
        <div class="news-content">✨ أهلاً بك في منصة الطفرة.. تم إضافة حصة جديدة للصف الأول الثانوي.. لا تنسوا موعد الامتحان الأسبوعي ✨</div>
    </div>

    <div id="authArea" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white p-10 rounded-[40px] shadow-2xl animate__animated animate__zoomIn">
            <div class="text-center mb-10">
                <div class="w-20 h-20 bg-cyan-500 rounded-[25px] mx-auto mb-4 flex items-center justify-center text-white text-4xl shadow-lg">🔬</div>
                <h1 class="text-3xl font-black text-slate-800">منصة الطفرة</h1>
                <p class="text-slate-400 font-bold">بوابتك للتميز مع ميس ندى كامل</p>
            </div>
            
            <div id="loginForm" class="space-y-4">
                <input id="p-phone" type="tel" placeholder="رقم الموبايل" class="w-full p-4 rounded-2xl bg-slate-50 border-none ring-1 ring-slate-200 outline-none focus:ring-2 focus:ring-cyan-500 transition-all">
                <input id="p-pass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-2xl bg-slate-50 border-none ring-1 ring-slate-200 outline-none focus:ring-2 focus:ring-cyan-500 transition-all">
                <button onclick="doLogin()" class="btn-premium w-full py-5 text-lg">دخول للمنصة</button>
                <div class="text-center mt-6">
                    <button onclick="showReg()" class="text-cyan-600 font-black">إنشاء حساب جديد 🎓</button>
                </div>
            </div>

            <div id="regForm" class="hidden space-y-4">
                <input id="r-name" type="text" placeholder="الاسم ثلاثي" class="w-full p-4 rounded-2xl bg-slate-50 ring-1 ring-slate-200 outline-none">
                <input id="r-phone" type="tel" placeholder="رقم الهاتف" class="w-full p-4 rounded-2xl bg-slate-50 ring-1 ring-slate-200 outline-none">
                <select id="r-year" class="w-full p-4 rounded-2xl bg-slate-50 ring-1 ring-slate-200 outline-none">
                    <option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option>
                </select>
                <input id="r-pass" type="password" placeholder="كلمة سر قوية" class="w-full p-4 rounded-2xl bg-slate-50 ring-1 ring-slate-200 outline-none">
                <button onclick="doReg()" class="btn-premium w-full py-5">تأكيد التسجيل</button>
                <button onclick="showLogin()" class="w-full text-slate-400 font-bold mt-4">رجوع للظلف</button>
            </div>
        </div>
    </div>

    <div id="appArea" class="hidden min-h-screen">
        <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-cyan-500 text-white flex items-center justify-center font-black shadow-md" id="avatar"></div>
                <div>
                    <div id="userName" class="font-black text-slate-800 text-sm"></div>
                    <div class="text-[10px] text-green-500 font-black">متصل الآن • <span id="statusText"></span></div>
                </div>
            </div>
            <button onclick="logout()" class="text-slate-300 hover:text-red-500 transition">خروج</button>
        </nav>

        <main class="p-6 max-w-xl mx-auto space-y-6">
            <div class="bg-gradient-to-r from-cyan-500 to-blue-600 p-6 rounded-[30px] text-white shadow-xl relative overflow-hidden">
                <h3 class="text-xl font-black mb-2 italic">مرحباً بك في رحلة العلم!</h3>
                <p class="text-cyan-100 text-sm">أنت الآن تشاهد محتوى مخصص لـ <span id="userYear" class="underline"></span></p>
                <div class="absolute -right-4 -bottom-4 opacity-20 text-8xl">🔬</div>
            </div>

            <div id="lessonsWall" class="space-y-4">
                </div>
        </main>
    </div>

    <div id="adminArea" class="hidden min-h-screen bg-slate-50 p-6">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-black text-slate-800">لوحة الإدارة 👑</h2>
                <button onclick="location.reload()" class="bg-white px-6 py-2 rounded-xl shadow-sm font-bold text-red-500">خروج</button>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-white p-8 rounded-[35px] shadow-sm border border-slate-100">
                    <h4 class="font-black mb-6 flex items-center gap-2 text-cyan-600"><span>🎬</span> رفع حصة جديدة</h4>
                    <input id="adm-t" placeholder="عنوان الدرس" class="w-full p-4 rounded-2xl bg-slate-50 mb-3 outline-none focus:ring-2 ring-cyan-500">
                    <input id="adm-u" placeholder="رابط فيديو (يوتيوب)" class="w-full p-4 rounded-2xl bg-slate-50 mb-3 outline-none focus:ring-2 ring-cyan-500">
                    <select id="adm-y" class="w-full p-4 rounded-2xl bg-slate-50 mb-6 outline-none">
                        <option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option>
                    </select>
                    <button onclick="pushLesson()" class="btn-premium w-full py-4">نشر الحصة للطلاب</button>
                </div>

                <div class="bg-white p-8 rounded-[35px] shadow-sm border border-slate-100">
                    <h4 class="font-black mb-6 flex items-center gap-2 text-rose-500"><span>🎫</span> الأكواد المتاحة</h4>
                    <div class="flex gap-2 mb-6">
                        <input id="adm-c" placeholder="اكتب كود جديد" class="flex-1 p-4 rounded-2xl bg-slate-50 outline-none">
                        <button onclick="pushCode()" class="bg-slate-800 text-white px-6 rounded-2xl font-bold">حفظ</button>
                    </div>
                    <div class="h-48 overflow-y-auto space-y-2 text-xs" id="hw-list">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <div id="playerModal" class="hidden fixed inset-0 z-[9999] bg-black flex items-center justify-center p-2">
        <div class="w-full max-w-5xl relative">
            <div id="videoContainer" class="aspect-video bg-black rounded-3xl overflow-hidden shadow-2xl border-4 border-white/5"></div>
            <button onclick="closePlayer()" class="absolute -top-14 left-0 text-white bg-white/10 px-8 py-2 rounded-full font-black">إغلاق الحصة ✕</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ", databaseURL: "https://tafra-online-default-rtdb.firebaseio.com", projectId: "tafra-online" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let user = null;

        // --- نظام الحماية والتشغيل ---
        window.doLogin = () => {
            const p = document.getElementById('p-phone').value;
            const ps = document.getElementById('p-pass');
            if(p === "01127266185" && ps.value === "Rtslanme 44") {
                showAdmin(); return;
            }
            get(child(ref(db), 'users/' + p)).then(s => {
                if(s.exists() && s.val().pass === ps.value) {
                    localStorage.setItem('tafra_session', JSON.stringify(s.val()));
                    location.reload();
                } else alert("بيانات غير صحيحة يا بطل!");
            });
        };

        const session = localStorage.getItem('tafra_session');
        if(session) {
            user = JSON.parse(session);
            document.getElementById('authArea').classList.add('hidden');
            document.getElementById('appArea').classList.remove('hidden');
            document.getElementById('userName').innerText = user.name;
            document.getElementById('userYear').innerText = user.year;
            document.getElementById('avatar').innerText = user.name[0];
            document.getElementById('statusText').innerText = user.isPaid ? "حسابك مفعل" : "بانتظار تفعيل الكود";
            
            // تفعيل العلامة المائية باسم الطالب
            const wm = document.getElementById('watermark');
            wm.innerText = `${user.name} - ${user.phone}`;
            wm.style.display = "block";
            
            loadLessons();
        }

        // --- وظائف الميس ---
        function showAdmin() {
            document.getElementById('authArea').classList.add('hidden');
            document.getElementById('adminArea').classList.remove('hidden');
            loadHw();
        }

        window.pushLesson = () => {
            const t = document.getElementById('adm-t').value;
            const u = document.getElementById('adm-u').value;
            const y = document.getElementById('adm-y').value;
            if(!t || !u) return;
            push(ref(db, 'lessons'), { title: t, url: u, year: y }).then(() => {
                alert("تم النشر بنجاح ✅");
                document.getElementById('adm-t').value = '';
            });
        };

        window.pushCode = () => {
            const c = document.getElementById('adm-c').value;
            set(ref(db, 'codes/' + c), { active: true }).then(() => alert("تم حفظ الكود " + c));
        };

        // --- وظائف الطالب ---
        function loadLessons() {
            onValue(ref(db, 'lessons'), s => {
                const wall = document.getElementById('lessonsWall'); wall.innerHTML = '';
                s.forEach(c => {
                    const l = c.val();
                    if(l.year === user.year) {
                        wall.innerHTML += `
                        <div class="lecture-card p-6 animate__animated animate__fadeInUp">
                            <div class="flex justify-between items-center mb-4">
                                <span class="bg-cyan-50 text-cyan-600 px-4 py-1 rounded-full text-xs font-black">حصة متاحة</span>
                                <span class="text-slate-300 text-xs font-bold italic">ميس ندى كامل</span>
                            </div>
                            <h4 class="font-black text-xl text-slate-800 mb-6">${l.title}</h4>
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="playVid('${l.url}')" class="bg-slate-900 text-white py-3 rounded-2xl font-bold text-sm">📺 مشاهدة</button>
                                <button onclick="sendHw('${l.title}')" class="bg-slate-100 text-slate-600 py-3 rounded-2xl font-bold text-sm">📝 الواجب</button>
                            </div>
                        </div>`;
                    }
                });
            });
        }

        window.playVid = (u) => {
            if(!user.isPaid) {
                const c = prompt("هذه المحاضرة تحتاج كود تفعيل، أدخل الكود:");
                get(child(ref(db), 'codes/' + c)).then(snap => {
                    if(snap.exists()) {
                        update(ref(db, 'users/' + user.phone), { isPaid: true });
                        remove(ref(db, 'codes/' + c));
                        alert("تم تفعيل حسابك! اضغط مشاهدة مرة أخرى.");
                        location.reload();
                    } else alert("كود غير صحيح!");
                });
                return;
            }
            document.getElementById('playerModal').classList.remove('hidden');
            const id = u.split('v=')[1]?.split('&')[0];
            document.getElementById('videoContainer').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0" frameborder="0" allowfullscreen></iframe>`;
        };

        window.sendHw = (title) => {
            const h = prompt("اكتب حلك هنا ميس ندى ستراجعه فوراً:");
            if(h) push(ref(db, 'homeworks'), { student: user.name, lesson: title, content: h }).then(() => alert("عاش يا بطل! تم استلام الواجب ✅"));
        };

        // --- تحسينات عامة ---
        window.showReg = () => { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('regForm').classList.remove('hidden'); };
        window.showLogin = () => { document.getElementById('regForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden'); };
        window.closePlayer = () => { document.getElementById('playerModal').classList.add('hidden'); document.getElementById('videoContainer').innerHTML = ''; };
        window.logout = () => { localStorage.clear(); location.reload(); };
        
        function loadHw() {
            onValue(ref(db, 'homeworks'), s => {
                const list = document.getElementById('hw-list'); list.innerHTML = '';
                s.forEach(c => {
                    const h = c.val();
                    list.innerHTML += `<div class="p-3 bg-slate-50 rounded-xl border-r-4 border-cyan-500"><b>${h.student}:</b> ${h.content}</div>`;
                });
            });
        }
    </script>
</body>
              </html>
