<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>الطفرة أونلاين - ميس ندى كامل</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
body { font-family: 'Almarai', sans-serif; background: #020617; color: white; user-select: none; }
.gold-text { color: #fbbf24; }
.gold-bg { background: linear-gradient(135deg, #fbbf24, #d97706); }
.card { background: #0f172a; border: 1px solid #1e293b; }
input, select { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; }
</style>
</head>
<body oncontextmenu="return false;">

<div id="authArea" class="min-h-screen flex items-center justify-center p-4">
    <div id="loginBox" class="card p-8 rounded-3xl w-full max-w-md shadow-2xl">
        <h1 class="text-3xl font-black gold-text text-center mb-6">الطفرة أونلاين</h1>
        <div id="loginFields" class="space-y-4">
            <input id="loginName" type="text" placeholder="الاسم الثلاثي" class="w-full p-4 rounded-xl outline-none focus:border-amber-500 text-right"/>
            <input id="loginPass" type="password" placeholder="كلمة المرور" class="w-full p-4 rounded-xl outline-none focus:border-amber-500 text-right"/>
            <button onclick="login()" class="w-full gold-bg p-4 rounded-xl font-bold text-slate-900 text-lg shadow-lg">تسجيل الدخول</button>
            <p class="text-center text-sm text-slate-400">ليس لديك حساب؟ <a href="javascript:void(0)" onclick="toggleAuth()" class="gold-text">أنشئ حساباً الآن</a></p>
        </div>

        <div id="registerFields" class="space-y-4 hidden">
            <input id="regName" type="text" placeholder="الاسم الثلاثي" class="w-full p-4 rounded-xl outline-none focus:border-amber-500 text-right"/>
            <input id="regPhone" type="tel" placeholder="رقم موبايلك" class="w-full p-4 rounded-xl outline-none focus:border-amber-500 text-right"/>
            <input id="regParentPhone" type="tel" placeholder="رقم ولي الأمر" class="w-full p-4 rounded-xl outline-none focus:border-amber-500 text-right"/>
            <select id="regGrade" class="w-full p-4 rounded-xl outline-none text-right">
                <option value="">اختر السنة الدراسية</option>
                <option>أولى ثانوي</option><option>ثانية ثانوي</option><option>ثالثة ثانوي</option>
            </select>
            <input id="regPass" type="password" placeholder="اختر كلمة مرور" class="w-full p-4 rounded-xl outline-none focus:border-amber-500 text-right"/>
            <button onclick="register()" class="w-full gold-bg p-4 rounded-xl font-bold text-slate-900 text-lg shadow-lg">إنشاء الحساب</button>
            <p class="text-center text-sm text-slate-400">لديك حساب بالفعل؟ <a href="javascript:void(0)" onclick="toggleAuth()" class="gold-text">سجل دخولك</a></p>
        </div>
    </div>
</div>

<div id="mainContent" class="hidden min-h-screen">
    <nav class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900 sticky top-0 z-50">
        <span id="userNameHeader" class="font-bold gold-text">مرحباً بك</span>
        <button onclick="logout()" class="bg-red-500/10 text-red-500 px-4 py-1 rounded-lg text-sm">خروج</button>
    </nav>

    <div class="max-w-4xl mx-auto p-4">
        <div id="codeEntryArea" class="card p-6 rounded-2xl mb-6 text-center">
            <h2 class="text-xl font-bold mb-4">الدخول للمحاضرة</h2>
            <div class="space-y-4">
                <select id="lessonSelect" class="w-full p-3 rounded-xl outline-none text-right">
                    <option value="">اختر المحاضرة التي تريد سماعها</option>
                </select>
                <input id="lessonCode" type="text" placeholder="اكتب كود المحاضرة هنا" class="w-full p-4 rounded-xl outline-none focus:border-amber-500 text-center font-bold uppercase tracking-widest"/>
                <button onclick="unlockLesson()" class="w-full gold-bg p-3 rounded-xl font-bold text-slate-900">فتح المحاضرة</button>
            </div>
        </div>

        <div id="videoArea" class="hidden animate-fade-in">
            <div class="aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 mb-6">
                <div id="player"></div>
            </div>
            
            <div class="card p-6 rounded-2xl">
                <h3 class="font-bold mb-4 text-amber-500">منتدى الأسئلة</h3>
                <div class="flex gap-2 mb-6">
                    <input id="qInput" type="text" placeholder="اسأل المدرس..." class="flex-1 p-3 rounded-xl outline-none text-right text-sm"/>
                    <button onclick="sendQ()" class="gold-bg px-6 rounded-xl text-slate-900 font-bold">إرسال</button>
                </div>
                <div id="qsList" class="space-y-4"></div>
            </div>
        </div>
    </div>
</div>

<script>
function getData(k){ return JSON.parse(localStorage.getItem(k)) || []; }
function saveData(k,d){ localStorage.setItem(k, JSON.stringify(d)); }

let currentUser = JSON.parse(sessionStorage.getItem('activeUser'));
if(currentUser) showDashboard();

function toggleAuth(){
    document.getElementById('loginFields').classList.toggle('hidden');
    document.getElementById('registerFields').classList.toggle('hidden');
}

function register(){
    const name = document.getElementById('regName').value.trim();
    const phone = document.getElementById('regPhone').value;
    const parent = document.getElementById('regParentPhone').value;
    const grade = document.getElementById('regGrade').value;
    const pass = document.getElementById('regPass').value;

    if(!name || !phone || !pass || !grade) return alert('برجاء إكمال البيانات');
    
    let users = getData('tafra_users');
    if(users.find(u => u.name === name)) return alert('هذا الاسم مسجل مسبقاً');

    users.push({name, phone, parent, grade, pass});
    saveData('tafra_users', users);
    alert('تم إنشاء الحساب بنجاح! سجل دخولك الآن');
    toggleAuth();
}

function login(){
    const name = document.getElementById('loginName').value.trim();
    const pass = document.getElementById('loginPass').value;
    let users = getData('tafra_users');
    let user = users.find(u => u.name === name && u.pass === pass);
    
    if(user){
        sessionStorage.setItem('activeUser', JSON.stringify(user));
        currentUser = user;
        showDashboard();
    } else { alert('خطأ في الاسم أو كلمة المرور'); }
}

function showDashboard(){
    document.getElementById('authArea').classList.add('hidden');
    document.getElementById('mainContent').classList.remove('hidden');
    document.getElementById('userNameHeader').textContent = 'مرحباً، ' + currentUser.name;
    loadLessonOptions();
}

function loadLessonOptions(){
    const lessons = getData('lessons');
    const select = document.getElementById('lessonSelect');
    select.innerHTML = '<option value="">اختر المحاضرة</option>' + 
        lessons.map(l => `<option value="${l.id}">${l.title}</option>`).join('');
}

let activeLesson = null;
function unlockLesson(){
    const lessonId = document.getElementById('lessonSelect').value;
    const codeIn = document.getElementById('lessonCode').value.trim().toUpperCase();
    const codes = getData('codes');
    const lesson = getData('lessons').find(l => l.id == lessonId);

    const validCode = codes.find(c => c.code === codeIn && c.lessonId == lessonId);
    
    if(validCode){
        activeLesson = lesson;
        document.getElementById('videoArea').classList.remove('hidden');
        const vidId = lesson.video.split('v=')[1]?.split('&')[0] || lesson.video.split('/').pop();
        document.getElementById('player').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${vidId}?rel=0" frameborder="0" allowfullscreen></iframe>`;
        loadQs();
    } else { alert('الكود غير صحيح لهذه المحاضرة'); }
}

function sendQ(){
    const txt = document.getElementById('qInput').value.trim();
    if(!txt) return;
    let qs = getData('questions');
    qs.push({id: Date.now(), student: currentUser.name, lessonId: activeLesson.id, text: txt, reply: null});
    saveData('questions', qs);
    document.getElementById('qInput').value = '';
    loadQs();
}

function loadQs(){
    const qs = getData('questions').filter(q => q.lessonId === activeLesson.id);
    document.getElementById('qsList').innerHTML = qs.map(q => `
        <div class="bg-slate-800/50 p-4 rounded-xl border border-slate-700">
            <p class="text-xs gold-text mb-1">${q.student}:</p>
            <p class="text-sm">${q.text}</p>
            ${q.reply ? `<div class="mt-2 p-2 bg-blue-900/20 border-r-2 border-blue-400 text-xs">${q.reply}</div>` : ''}
        </div>
    `).reverse().join('');
}

function logout(){ sessionStorage.clear(); location.reload(); }
</script>
</body>
</html>
