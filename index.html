<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Tafra Online | منصة الطفرة التعليمية - ميس ندى كامل</title>
    <meta name="description" content="Tafra Online - المنصة الرسمية لميس ندى كامل لتدريس العلوم. محاضرات تفاعلية، نظام واجبات متطور، وحماية كاملة للمحتوى.">
    <meta name="keywords" content="Tafra Online, منصة الطفرة, ميس ندى كامل, علوم, كيمياء, فيزياء, إعدادي, ثانوي">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #020617; color: white; user-select: none; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-main { background: linear-gradient(135deg, #2563eb, #7c3aed); transition: 0.3s; font-weight: bold; }
        .btn-main:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4); }
        .input-dark { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 15px; width: 100%; color: white; outline: none; transition: 0.3s; }
        .input-dark:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }
        .watermark { position: absolute; color: rgba(255,255,255,0.12); font-size: 14px; pointer-events: none; z-index: 1000; animation: moveWatermark 15s infinite linear; white-space: nowrap; }
        @keyframes moveWatermark { 0% { top: 5%; left: 5%; } 50% { top: 85%; left: 75%; } 100% { top: 5%; left: 5%; } }
        .hidden { display: none; }
        .tab-content { display: none; }
        .active-tab { display: block; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="entryScreen" class="fixed inset-0 z-[3000] bg-[#020617] flex items-center justify-center p-4">
        <div class="text-center w-full max-w-2xl">
            <h1 class="text-5xl font-black italic mb-2 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">TAFRA ONLINE</h1>
            <p class="text-gray-400 mb-12 text-lg">مرحباً بك في صرح ميس ندى كامل للعلوم 🔬</p>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div onclick="goToStudentAuth()" class="glass p-10 rounded-[3rem] border-blue-500/20 hover:border-blue-500 cursor-pointer transition group">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition">🎓</div>
                    <h2 class="text-2xl font-bold">دخول الطلاب</h2>
                    <p class="text-gray-500 text-sm mt-2">شاهد محاضراتك وسلم واجباتك</p>
                </div>
                <div onclick="goToAdminAuth()" class="glass p-10 rounded-[3rem] border-purple-500/20 hover:border-purple-500 cursor-pointer transition group">
                    <div class="text-6xl mb-4 group-hover:scale-110 transition">👑</div>
                    <h2 class="text-2xl font-bold">لوحة الإدارة</h2>
                    <p class="text-gray-500 text-sm mt-2">للميس ندى كامل فقط</p>
                </div>
            </div>
        </div>
    </div>

    <div id="studentAuthPage" class="hidden fixed inset-0 z-[2000] bg-[#020617] flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-lg border-blue-500/20">
            <button onclick="backToEntry()" class="text-xs text-gray-500 mb-4 underline">← العودة للخلف</button>
            <div class="flex p-1 bg-white/5 rounded-2xl mb-8">
                <button onclick="toggleStudentMode('login')" id="sLoginTab" class="flex-1 py-3 rounded-xl font-bold bg-blue-600">تسجيل دخول</button>
                <button onclick="toggleStudentMode('signup')" id="sSignupTab" class="flex-1 py-3 rounded-xl font-bold">حساب جديد</button>
            </div>

            <div id="sLoginForm" class="space-y-4">
                <input id="lPhone" type="tel" placeholder="رقم الموبايل" class="input-dark">
                <input id="lPass" type="password" placeholder="كلمة المرور" class="input-dark">
                <button onclick="doLogin()" class="w-full btn-main p-4 rounded-2xl">دخول المنصة 🚀</button>
            </div>

            <div id="sSignupForm" class="hidden space-y-3">
                <input id="rName" type="text" placeholder="الاسم الثلاثي" class="input-dark">
                <input id="rPhone" type="tel" placeholder="رقم الموبايل" class="input-dark">
                <div class="grid grid-cols-2 gap-2">
                    <select id="rStage" class="input-dark" onchange="syncYears()"><option value="">المرحلة</option><option value="prep">إعدادي</option><option value="sec">ثانوي</option></select>
                    <select id="rYear" class="input-dark"><option value="">السنة</option></select>
                </div>
                <input id="rPass" type="password" placeholder="اختر كلمة مرور" class="input-dark">
                <button onclick="doSignup()" class="w-full bg-purple-600 p-4 rounded-2xl font-bold">إنشاء الحساب الآن</button>
            </div>
        </div>
    </div>

    <div id="studentDashboard" class="hidden min-h-screen">
        <nav class="p-4 glass flex justify-between items-center sticky top-0 z-[100]">
            <span class="font-black text-xl italic text-blue-500">TAFRA ONLINE</span>
            <div class="flex items-center gap-3">
                <span id="displayStudentName" class="text-xs font-bold text-blue-300"></span>
                <button onclick="logout()" class="text-red-500 text-xs">خروج</button>
            </div>
        </nav>

        <div class="flex justify-center gap-4 p-4 bg-white/5 shadow-inner">
            <button id="btn-lessons" onclick="switchTab('lessons')" class="px-8 py-2 rounded-full font-bold bg-blue-600">المحاضرات</button>
            <button id="btn-hw" onclick="switchTab('hw')" class="px-8 py-2 rounded-full bg-white/5">الواجبات</button>
        </div>

        <main class="p-6 max-w-6xl mx-auto">
            <div id="tab-lessons" class="tab-content active-tab grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            
            <div id="tab-hw" class="tab-content hidden max-w-lg mx-auto">
                <div class="glass p-8 rounded-[3rem] text-center border-green-500/20">
                    <h2 class="text-2xl font-black mb-2 text-green-400">تسليم الواجب 📝</h2>
                    <input id="hwLesson" type="text" placeholder="اسم الحصة" class="input-dark mb-4">
                    <textarea id="hwContent" placeholder="اكتب الحل هنا أو لينك الحل" class="input-dark h-32 mb-4"></textarea>
                    <button onclick="submitHw()" class="w-full bg-green-600 p-4 rounded-2xl font-black">إرسال الواجب للميس</button>
                </div>
            </div>
        </main>
    </div>

    <div id="adminPanel" class="hidden min-h-screen p-6">
        <nav class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-black text-purple-400 italic underline">CONTROL PANEL</h2>
            <button onclick="logout()" class="bg-red-900/30 text-red-500 px-4 py-2 rounded-xl">خروج</button>
        </nav>
        
        <div class="max-w-4xl mx-auto space-y-10">
            <div class="glass p-8 rounded-[2.5rem] border-blue-500/30">
                <h3 class="text-xl font-bold mb-6">نشر محاضرة جديدة 🧪</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="vTitle" type="text" placeholder="اسم المحاضرة" class="input-dark">
                    <input id="vUrl" type="text" placeholder="رابط يوتيوب" class="input-dark">
                    <select id="vYear" class="input-dark">
                        <option value="أولى إعدادي">أولى إعدادي</option><option value="تانية إعدادي">تانية إعدادي</option><option value="تالتة إعدادي">تالتة إعدادي</option>
                        <option value="أولى ثانوي">أولى ثانوي</option><option value="تانية ثانوي">تانية ثانوي</option><option value="تالتة ثانوي">تالتة ثانوي</option>
                    </select>
                    <input id="vCode" type="text" placeholder="كود التفعيل" class="input-dark">
                    <button onclick="uploadLesson()" class="md:col-span-2 btn-main p-4 rounded-xl">نشر الآن</button>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div class="glass p-6 rounded-[2rem]">
                    <h4 class="font-bold mb-4 border-b border-white/10 pb-2">الواجبات المسلمة:</h4>
                    <div id="adminHwList" class="space-y-2 text-[10px] max-h-60 overflow-y-auto"></div>
                </div>
                <div class="glass p-6 rounded-[2rem]">
                    <h4 class="font-bold mb-4 border-b border-white/10 pb-2">إدارة الطلاب:</h4>
                    <div id="adminStudentList" class="space-y-2 text-[10px] max-h-60 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="videoModal" class="fixed inset-0 z-[5000] bg-black/98 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-4xl relative">
            <div id="lockZone" class="text-center p-12 glass rounded-[3rem]">
                <div class="text-6xl mb-4">🔐</div>
                <h3 class="text-2xl font-black mb-6">هذه المحاضرة محمية</h3>
                <input id="unlockKey" type="text" placeholder="كود تفعيل الحصة" class="input-dark max-w-xs mb-6 text-center text-xl font-bold tracking-[5px]">
                <div class="flex gap-4 justify-center">
                    <button onclick="checkVideoKey()" class="btn-main px-12 py-3 rounded-xl">تفعيل</button>
                    <button onclick="closeModal()" class="bg-white/10 px-10 py-3 rounded-xl">إلغاء</button>
                </div>
            </div>
            <div id="videoContainer" class="hidden relative rounded-[2rem] overflow-hidden border-2 border-blue-600 shadow-2xl">
                <div id="wm" class="watermark"></div>
                <div id="playerFrame" class="aspect-video bg-black"></div>
                <button onclick="closeModal()" class="mt-4 text-gray-500 w-full text-center hover:text-white transition">رجوع للمنصة</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ",
            authDomain: "tafra-online.firebaseapp.com",
            databaseURL: "https://tafra-online-default-rtdb.firebaseio.com",
            projectId: "tafra-online",
            storageBucket: "tafra-online.firebaseapp.com",
            messagingSenderId: "715653554628",
            appId: "1:715653554628:web:24ce873f34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let user = null; let activeCode = ""; let activeUrl = "";

        // الحماية
        document.onkeydown = (e) => { if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) return false; };

        // التنقل بين الشاشات
        window.goToStudentAuth = () => { document.getElementById('entryScreen').classList.add('hidden'); document.getElementById('studentAuthPage').classList.remove('hidden'); };
        window.goToAdminAuth = () => {
            const pw = prompt("كلمة سر الإدارة العليا:");
            if(pw === "Rtslanme 44") {
                document.getElementById('entryScreen').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadAdminData();
            } else { alert("عفواً! كلمة السر غير صحيحة."); }
        };
        window.backToEntry = () => { document.getElementById('studentAuthPage').classList.add('hidden'); document.getElementById('entryScreen').classList.remove('hidden'); };

        window.toggleStudentMode = (m) => {
            document.getElementById('sLoginForm').classList.toggle('hidden', m === 'signup');
            document.getElementById('sSignupForm').classList.toggle('hidden', m === 'login');
            document.getElementById('sLoginTab').classList.toggle('bg-blue-600', m === 'login');
            document.getElementById('sSignupTab').classList.toggle('bg-blue-600', m === 'signup');
        };

        window.syncYears = () => {
            const s = document.getElementById('rStage').value;
            const ySelect = document.getElementById('rYear');
            ySelect.innerHTML = '';
            const opts = s === 'prep' ? ['أولى إعدادي','تانية إعدادي','تالتة إعدادي'] : ['أولى ثانوي','تانية ثانوي','تالتة ثانوي'];
            opts.forEach(o => ySelect.innerHTML += `<option value="${o}">${o}</option>`);
        };

        // تسجيل الطالب
        window.doSignup = () => {
            const d = { name: document.getElementById('rName').value, phone: document.getElementById('rPhone').value, year: document.getElementById('rYear').value, pass: document.getElementById('rPass').value, status: 'active' };
            if(!d.name || !d.phone || !d.pass) return alert("أكمل بياناتك يا بطل!");
            set(ref(db, 'users/' + d.phone), d).then(() => { alert("تم إنشاء الحساب! سجل دخولك الآن."); toggleStudentMode('login'); });
        };

        window.doLogin = () => {
            const ph = document.getElementById('lPhone').value;
            const ps = document.getElementById('lPass').value;
            get(child(ref(db), 'users/' + ph)).then(s => {
                if(s.exists() && s.val().pass === ps) {
                    if(s.val().status === 'blocked') return alert("عفواً! حسابك محظور.");
                    localStorage.setItem('tafra_user', JSON.stringify(s.val()));
                    location.reload();
                } else alert("بيانات دخول خاطئة!");
            });
        };

        // التحقق من الجلسة
        const saved = localStorage.getItem('tafra_user');
        if(saved) {
            user = JSON.parse(saved);
            document.getElementById('entryScreen').classList.add('hidden');
            document.getElementById('studentDashboard').classList.remove('hidden');
            document.getElementById('displayStudentName').innerText = user.name;
            loadLessons();
        }

        window.switchTab = (t) => {
            document.getElementById('tab-lessons').classList.toggle('active-tab', t === 'lessons');
            document.getElementById('tab-hw').classList.toggle('active-tab', t === 'hw');
            document.getElementById('btn-lessons').classList.toggle('bg-blue-600', t === 'lessons');
            document.getElementById('btn-hw').classList.toggle('bg-blue-600', t === 'hw');
        };

        function loadLessons() {
            onValue(ref(db, 'lessons'), s => {
                const grid = document.getElementById('tab-lessons'); grid.innerHTML = '';
                s.forEach(c => {
                    const l = c.val();
                    if(l.year === user.year) grid.innerHTML += `
                        <div onclick="openVideo('${l.url}','${l.code}')" class="glass p-6 rounded-[2.5rem] border-r-4 border-blue-500 cursor-pointer hover:bg-white/5 transition">
                            <div class="text-3xl mb-2">🎬</div>
                            <h4 class="font-bold text-lg mb-1">${l.title}</h4>
                            <p class="text-[10px] text-gray-500 italic">علوم | ميس ندى كامل</p>
                        </div>`;
                });
            });
        }

        window.openVideo = (u, c) => { activeUrl = u; activeCode = c; document.getElementById('videoModal').classList.remove('hidden'); document.getElementById('lockZone').classList.remove('hidden'); document.getElementById('videoContainer').classList.add('hidden'); };

        window.checkVideoKey = () => {
            if(document.getElementById('unlockKey').value === activeCode) {
                document.getElementById('lockZone').classList.add('hidden');
                document.getElementById('videoContainer').classList.remove('hidden');
                const vidId = activeUrl.split('v=')[1]?.split('&')[0];
                document.getElementById('playerFrame').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${vidId}?rel=0&modestbranding=1" frameborder="0" allowfullscreen></iframe>`;
                document.getElementById('wm').innerText = `${user.name} - ${user.phone}`;
            } else alert("الكود غير صحيح!");
        };

        window.uploadLesson = () => {
            push(ref(db, 'lessons'), { title: document.getElementById('vTitle').value, url: document.getElementById('vUrl').value, year: document.getElementById('vYear').value, code: document.getElementById('vCode').value }).then(() => alert("تم النشر بنجاح!"));
        };

        window.submitHw = () => {
            push(ref(db, 'homeworks'), { student: user.name, phone: user.phone, lesson: document.getElementById('hwLesson').value, content: document.getElementById('hwContent').value }).then(() => alert("تم استلام الواجب ✅"));
        };

        function loadAdminData() {
            onValue(ref(db, 'homeworks'), s => {
                const list = document.getElementById('adminHwList'); list.innerHTML = '';
                s.forEach(c => { const h = c.val(); list.innerHTML += `<div class="bg-white/5 p-2 rounded">طالب: ${h.student} | حصة: ${h.lesson} | الحل: ${h.content}</div>`; });
            });
            onValue(ref(db, 'users'), s => {
                const list = document.getElementById('adminStudentList'); list.innerHTML = '';
                s.forEach(c => { 
                    const st = c.val(); 
                    list.innerHTML += `<div class="flex justify-between bg-white/5 p-2 rounded">
                        <span>${st.name} (${st.phone})</span>
                        <button onclick="toggleBlock('${st.phone}', '${st.status}')" class="text-red-500 underline">${st.status === 'active' ? 'حظر' : 'فك حظر'}</button>
                    </div>`; 
                });
            });
        }

        window.toggleBlock = (ph, stat) => { update(ref(db, 'users/' + ph), { status: stat === 'active' ? 'blocked' : 'active' }); };
        window.logout = () => { localStorage.clear(); location.reload(); };
        window.closeModal = () => { document.getElementById('videoModal').classList.add('hidden'); document.getElementById('playerFrame').innerHTML = ''; };
    </script>
</body>
                        </html>
