<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الطفرة برو | ميس ندى كامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #020617; color: white; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .input-dark { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 12px; width: 100%; color: white; outline: none; }
        .input-dark:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .btn-main { background: linear-gradient(135deg, #2563eb, #9333ea); transition: 0.3s; }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(37, 99, 235, 0.4); }
        .watermark { position: absolute; color: rgba(255,255,255,0.15); font-size: 12px; pointer-events: none; animation: float 10s infinite linear; z-index: 50; }
        @keyframes float { 0% { top: 10%; left: 10%; } 50% { top: 80%; left: 70%; } 100% { top: 10%; left: 10%; } }
    </style>
</head>
<body>

    <div id="authPage" class="fixed inset-0 z-[1000] bg-[#020617] flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-lg border-blue-500/20">
            <div class="text-center mb-6">
                <span class="text-5xl">🔭</span>
                <h1 class="text-3xl font-black mt-2 bg-gradient-to-l from-blue-400 to-purple-500 bg-clip-text text-transparent">منصة الطفرة برو</h1>
            </div>

            <div id="authTabs" class="flex p-1 bg-white/5 rounded-2xl mb-6">
                <button onclick="switchTab('login')" id="loginTab" class="flex-1 py-2 rounded-xl font-bold bg-blue-600">دخول</button>
                <button onclick="switchTab('signup')" id="signupTab" class="flex-1 py-2 rounded-xl font-bold">حساب جديد</button>
            </div>

            <div id="loginForm" class="space-y-4">
                <input id="lPhone" type="tel" placeholder="رقم الموبايل" class="input-dark">
                <input id="lPass" type="password" placeholder="كلمة المرور" class="input-dark">
                <button onclick="doLogin()" class="w-full btn-main p-4 rounded-2xl font-black">انطلاق 🚀</button>
            </div>

            <div id="signupForm" class="hidden space-y-3">
                <input id="rName" type="text" placeholder="الاسم بالكامل" class="input-dark">
                <input id="rPhone" type="tel" placeholder="رقم الموبايل" class="input-dark">
                <input id="rParent" type="tel" placeholder="رقم ولي الأمر" class="input-dark">
                
                <div class="grid grid-cols-2 gap-2">
                    <select id="rStage" class="input-dark" onchange="updateYears()">
                        <option value="">المرحلة</option>
                        <option value="prep">إعدادي</option>
                        <option value="sec">ثانوي</option>
                    </select>
                    <select id="rYear" class="input-dark">
                        <option value="">السنة الدراسية</option>
                    </select>
                </div>
                
                <input id="rSchool" type="text" placeholder="المدرسة" class="input-dark">
                <input id="rPass" type="password" placeholder="باسورد الدخول" class="input-dark">
                <button onclick="doSignup()" class="w-full bg-purple-600 p-4 rounded-2xl font-black">تأكيد الحساب</button>
            </div>
        </div>
    </div>

    <div id="mainContent" class="hidden min-h-screen">
        <nav class="p-4 glass flex justify-between items-center sticky top-0 z-50">
            <h2 class="font-black text-xl italic text-blue-500">TAFRA</h2>
            <div class="flex items-center gap-3">
                <span id="userName" class="text-xs font-bold bg-white/5 px-3 py-1 rounded-full border border-white/10"></span>
                <button onclick="openAdmin()" class="opacity-30 hover:opacity-100 transition">⚙️</button>
                <button onclick="logout()" class="text-red-500 text-xs font-bold">خروج</button>
            </div>
        </nav>

        <main class="p-6 max-w-6xl mx-auto">
            <div id="adminPanel" class="hidden glass p-6 rounded-[2rem] mb-10 border-purple-500/30">
                <h3 class="text-xl font-bold mb-4 text-purple-400">رفع درس جديد (أدمن)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <input id="vTitle" type="text" placeholder="اسم الدرس" class="input-dark">
                    <input id="vUrl" type="text" placeholder="رابط فيديو اليوتيوب" class="input-dark">
                    <select id="vStage" class="input-dark" onchange="updateAdminYears()">
                        <option value="prep">إعدادي</option>
                        <option value="sec">ثانوي</option>
                    </select>
                    <select id="vYear" class="input-dark"></select>
                    <input id="vCode" type="text" placeholder="كود التفعيل" class="input-dark">
                    <button onclick="uploadLesson()" class="md:col-span-2 btn-main p-3 rounded-xl font-bold">نشر الدرس للطلاب</button>
                </div>
            </div>

            <div class="mb-8">
                <h1 id="yearTitle" class="text-2xl font-black mb-2"></h1>
                <p class="text-gray-500 text-sm italic">ابحث عن دروسك يا بطل وشغلها بالأكواد</p>
            </div>

            <div id="lessonsGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                </div>
        </main>
    </div>

    <div id="playerModal" class="fixed inset-0 z-[2000] bg-black/95 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-4xl relative">
            <div id="lockScreen" class="text-center p-10 glass rounded-[3rem]">
                <span class="text-5xl block mb-4">💎</span>
                <h3 class="text-2xl font-black mb-2">هذه الحصة خاصة</h3>
                <p class="text-gray-400 mb-8">يجب كتابة كود الشحن لتفعيل المحاضرة</p>
                <input id="unlockCode" type="text" placeholder="أدخل الكود هنا" class="input-dark max-w-xs mb-6 text-center text-2xl tracking-[5px]">
                <div class="flex gap-4 justify-center">
                    <button onclick="activateVideo()" class="btn-main px-10 py-4 rounded-2xl font-bold">تفعيل الآن</button>
                    <button onclick="closePlayer()" class="bg-white/10 px-10 py-4 rounded-2xl font-bold">إلغاء</button>
                </div>
            </div>

            <div id="videoScreen" class="hidden">
                <div class="relative aspect-video rounded-[2.5rem] overflow-hidden border-2 border-blue-600 shadow-2xl">
                    <div id="watermarkBox" class="watermark"></div>
                    <div id="videoPlayer" class="w-full h-full"></div>
                </div>
                <button onclick="closePlayer()" class="mt-6 text-gray-500 w-full hover:text-white transition">إغلاق المشاهدة</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBRZcq2XFPt500dJ8okpxNZ",
            authDomain: "tafra-online.firebaseapp.com",
            databaseURL: "https://tafra-online-default-rtdb.firebaseio.com",
            projectId: "tafra-online",
            storageBucket: "tafra-online.firebaseapp.com",
            messagingSenderId: "715653554628",
            appId: "1:715653554628:web:24ce873f34"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let user = null;
        let v_url = "", v_code = "";

        // تحديث القوائم
        const yearsMap = {
            'prep': ['أولى إعدادي', 'تانية إعدادي', 'تالتة إعدادي'],
            'sec': ['أولى ثانوي', 'تانية ثانوي', 'تالتة ثانوي']
        };

        window.updateYears = () => {
            const stage = document.getElementById('rStage').value;
            const select = document.getElementById('rYear');
            select.innerHTML = '<option value="">السنة</option>';
            if(stage) yearsMap[stage].forEach(y => select.innerHTML += `<option value="${y}">${y}</option>`);
        };

        window.updateAdminYears = () => {
            const stage = document.getElementById('vStage').value;
            const select = document.getElementById('vYear');
            select.innerHTML = '';
            yearsMap[stage].forEach(y => select.innerHTML += `<option value="${y}">${y}</option>`);
        };

        window.switchTab = (tab) => {
            document.getElementById('loginForm').classList.toggle('hidden', tab === 'signup');
            document.getElementById('signupForm').classList.toggle('hidden', tab === 'login');
            document.getElementById('loginTab').className = `flex-1 py-2 rounded-xl font-bold ${tab === 'login' ? 'bg-blue-600' : ''}`;
            document.getElementById('signupTab').className = `flex-1 py-2 rounded-xl font-bold ${tab === 'signup' ? 'bg-blue-600' : ''}`;
        };

        // التسجيل والدخول
        window.doSignup = () => {
            const data = {
                name: document.getElementById('rName').value,
                phone: document.getElementById('rPhone').value,
                parent: document.getElementById('rParent').value,
                stage: document.getElementById('rStage').value,
                year: document.getElementById('rYear').value,
                school: document.getElementById('rSchool').value,
                pass: document.getElementById('rPass').value,
                status: 'active'
            };
            if(!data.name || !data.phone || !data.year) return alert("املا كل الخانات!");
            set(ref(db, 'users/' + data.phone), data).then(() => { alert("تم التسجيل! سجل دخولك الآن."); switchTab('login'); });
        };

        window.doLogin = () => {
            const ph = document.getElementById('lPhone').value;
            const ps = document.getElementById('lPass').value;
            get(child(ref(db), 'users/' + ph)).then(snap => {
                if(snap.exists() && snap.val().pass === ps) {
                    if(snap.val().status === 'blocked') return alert("حسابك محظور!");
                    localStorage.setItem('tafra_user', JSON.stringify(snap.val()));
                    location.reload();
                } else { alert("بيانات غلط!"); }
            });
        };

        // تشغيل المنصة
        const saved = localStorage.getItem('tafra_user');
        if(saved) {
            user = JSON.parse(saved);
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainContent').classList.remove('hidden');
            document.getElementById('userName').innerText = user.name;
            document.getElementById('yearTitle').innerText = `حصص ${user.year}`;
            loadLessons();
            updateAdminYears();
        }

        window.uploadLesson = () => {
            const lesson = {
                title: document.getElementById('vTitle').value,
                url: document.getElementById('vUrl').value,
                year: document.getElementById('vYear').value,
                code: document.getElementById('vCode').value
            };
            push(ref(db, 'lessons'), lesson).then(() => alert("تم النشر!"));
        };

        function loadLessons() {
            onValue(ref(db, 'lessons'), (snapshot) => {
                const grid = document.getElementById('lessonsGrid');
                grid.innerHTML = '';
                snapshot.forEach(child => {
                    const l = child.val();
                    // الفلترة هنا: لو السنة بتاعة الدرس مطابقة لسنة الطالب بتظهر
                    if(l.year === user.year) {
                        grid.innerHTML += `
                            <div onclick="openVideo('${l.url}', '${l.code}')" class="glass p-6 rounded-[2rem] border-b-4 border-blue-600 hover:bg-white/5 transition cursor-pointer relative overflow-hidden group">
                                <div class="w-12 h-12 bg-blue-600/20 rounded-xl mb-4 flex items-center justify-center text-2xl group-hover:bg-blue-600 transition">🎬</div>
                                <h4 class="font-bold text-lg mb-1">${l.title}</h4>
                                <p class="text-xs text-gray-500 italic">مادة العلوم - ميس ندى</p>
                                <div class="mt-4 flex items-center justify-between">
                                    <span class="text-[10px] bg-white/5 px-2 py-1 rounded">محاضرة مغلقة</span>
                                    <span class="text-blue-400 font-bold text-sm">شاهد الآن 🔒</span>
                                </div>
                            </div>
                        `;
                    }
                });
            });
        }

        window.openVideo = (url, code) => {
            v_url = url; v_code = code;
            document.getElementById('playerModal').classList.remove('hidden');
            document.getElementById('lockScreen').classList.remove('hidden');
            document.getElementById('videoScreen').classList.add('hidden');
        };

        window.activateVideo = () => {
            if(document.getElementById('unlockCode').value === v_code) {
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('videoScreen').classList.remove('hidden');
                const id = v_url.split('v=')[1];
                document.getElementById('videoPlayer').innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?rel=0&controls=1&modestbranding=1" frameborder="0" allowfullscreen></iframe>`;
                document.getElementById('watermarkBox').innerText = `${user.name} - ${user.phone}`;
            } else { alert("كود غلط!"); }
        };

        window.closePlayer = () => {
            document.getElementById('playerModal').classList.add('hidden');
            document.getElementById('videoPlayer').innerHTML = '';
        };

        window.openAdmin = () => { if(prompt("باسورد الإدارة:") === "tafra2026") document.getElementById('adminPanel').classList.toggle('hidden'); };
        window.logout = () => { localStorage.clear(); location.reload(); };
    </script>
</body>
</html>
